<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michael Couper Instagram Profile Mock</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #111; }
    .phone {
      width: 1080px;
      background: #FAFAFA;
      color: #17171A;
      font-family: Archivo, system-ui, sans-serif;
      padding-bottom: 40px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 36px 18px;
      font-size: 28px;
      font-weight: 700;
      border-bottom: 1px solid #EFEFEF;
    }
    .header {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 36px;
      padding: 36px 40px 28px;
      align-items: center;
    }
    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 15%;
      border: 3px solid #E9E4D8;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 12px;
    }
    .stats strong { display: block; font-size: 28px; }
    .stats span { font-size: 16px; color: #666; }
    .bio {
      padding: 0 40px 28px;
    }
    .bio h1 { font-size: 22px; margin-bottom: 8px; }
    .bio p { font-size: 20px; line-height: 1.45; color: #222; max-width: 42ch; }
    .bio .tag {
      margin-top: 10px;
      color: #6E4CFF;
      font-weight: 600;
      font-size: 18px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 40px 28px;
    }
    .actions div {
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      background: #EFEFEF;
      font-weight: 700;
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      border-top: 1px solid #EFEFEF;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="phone" id="artboard">
    <div class="top"><span>michaelcouper</span><span>···</span></div>
    <div class="header">
      <img class="avatar" src="../assets/imagery/profile-avatar-tight.jpg" alt="">
      <div class="stats">
        <div><strong>48</strong><span>posts</span></div>
        <div><strong>2.1K</strong><span>followers</span></div>
        <div><strong>312</strong><span>following</span></div>
      </div>
    </div>
    <div class="bio">
      <h1>Michael Couper</h1>
      <p>Composer-engineer. Context for independent thinkers. Follow the question.</p>
      <p class="tag">Question First</p>
    </div>
    <div class="actions">
      <div>Edit profile</div>
      <div>Share profile</div>
    </div>
    <div class="grid">
      <img src="../assets/imagery/desk-hero.jpg" alt="">
      <img src="../assets/imagery/conversation-glass.jpg" alt="">
      <img src="../assets/imagery/studio-polo.jpg" alt="">
      <img src="../assets/imagery/countryside-thinking.jpg" alt="">
      <img src="../assets/imagery/tuxedo-evening.jpg" alt="">
      <img src="../../../brand-os/brands/michael-couper/images/applications/instagram-finding.png" alt="">
    </div>
  </div>
</body>
</html>
