<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michael Couper YouTube Channel Mock</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #111; }
    .channel {
      width: 1400px;
      background: #0F0F0F;
      color: #F1F1F1;
      font-family: Archivo, system-ui, sans-serif;
      padding-bottom: 40px;
    }
    .banner {
      height: 280px;
      position: relative;
      overflow: hidden;
      background: #17171A;
    }
    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% 40%;
      filter: brightness(.55);
    }
    .banner .copy {
      position: absolute;
      left: 48px;
      top: 64px;
      max-width: 520px;
    }
    .banner .copy .k {
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 14px;
      color: rgba(233,228,216,.75);
      margin-bottom: 10px;
    }
    .banner .copy h1 {
      font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
      font-size: 56px;
      line-height: .95;
      font-weight: 600;
      letter-spacing: -.02em;
      color: #E9E4D8;
    }
    .banner .copy p {
      margin-top: 14px;
      font-size: 20px;
      color: rgba(233,228,216,.88);
      max-width: 34ch;
    }
    .seam {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(110,76,255,.1), rgba(110,76,255,.8), rgba(110,76,255,.15));
    }
    .row {
      display: flex;
      gap: 24px;
      align-items: center;
      padding: 28px 40px 18px;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 15%;
      border: 2px solid #2A2A2A;
    }
    .meta h2 { font-size: 28px; font-weight: 700; }
    .meta p { margin-top: 6px; color: #AAA; font-size: 16px; }
    .tabs {
      display: flex;
      gap: 28px;
      padding: 8px 40px 18px;
      border-bottom: 1px solid #272727;
      color: #AAA;
      font-size: 16px;
      font-weight: 600;
    }
    .tabs .on { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 10px; }
    .videos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 28px 40px;
    }
    .video {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
    }
    .video img {
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 420px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .video .cap {
      padding: 14px 14px 18px;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="channel" id="artboard">
    <div class="banner">
      <!-- Brand world banner — not the avatar face -->
      <img src="../assets/imagery/banner-city-glass.jpg" alt="">
      <div class="seam" aria-hidden="true"></div>
      <div class="copy">
        <div class="k">Michael Couper</div>
        <h1>Follow the question</h1>
        <p>Inquiry that lands in a usable judgment.</p>
      </div>
    </div>
    <div class="row">
      <img class="avatar" src="../assets/imagery/profile-avatar-tight.jpg" alt="">
      <div class="meta">
        <h2>Michael Couper</h2>
        <p>@michaelcouper · 1.2K subscribers · 36 videos</p>
      </div>
    </div>
    <div class="tabs">
      <div class="on">Home</div>
      <div>Videos</div>
      <div>Shorts</div>
      <div>About</div>
    </div>
    <div class="videos">
      <div class="video">
        <img src="../assets/imagery/desk-hero.jpg" alt="">
        <div class="cap">Inquiry at work · Follow the question</div>
      </div>
      <div class="video">
        <img src="../assets/imagery/studio-polo.jpg" alt="">
        <div class="cap">Quiet media · See the whole picture</div>
      </div>
      <div class="video">
        <img src="../assets/imagery/teaching-side.jpg" alt="">
        <div class="cap">Teaching · Question First</div>
      </div>
    </div>
  </div>
</body>
</html>
