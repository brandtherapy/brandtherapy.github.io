<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michael Couper · Counterpoint Cover Concept</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #111; }
    .cover {
      width: 1200px;
      height: 1600px;
      position: relative;
      overflow: hidden;
      background: #17171A;
      color: #E9E4D8;
      font-family: Archivo, Arial, sans-serif;
    }
    .cover img.hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 52% 18%;
    }
    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(23,23,26,.62) 0%, rgba(23,23,26,.08) 30%, rgba(23,23,26,.28) 58%, rgba(23,23,26,.94) 100%);
    }
    .seam {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(110,76,255,.05), rgba(110,76,255,.72), rgba(110,76,255,.08));
      z-index: 3;
    }
    .mast {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    .mast .name {
      font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
      font-size: 88px;
      letter-spacing: .1em;
      line-height: 1;
      text-transform: uppercase;
      font-weight: 600;
    }
    .mast .issue {
      margin-top: 12px;
      font-size: 15px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(233,228,216,.74);
    }
    .bottom {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 72px;
      z-index: 2;
    }
    .bottom .label {
      font-size: 14px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(233,228,216,.72);
      margin-bottom: 18px;
    }
    .bottom h1 {
      font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
      font-size: 96px;
      line-height: .92;
      letter-spacing: -.02em;
      max-width: 12ch;
      font-weight: 600;
    }
    .bottom .deck {
      margin-top: 22px;
      font-size: 26px;
      line-height: 1.35;
      max-width: 28ch;
      color: rgba(233,228,216,.9);
    }
    .note {
      position: absolute;
      top: 168px;
      right: 56px;
      z-index: 2;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(233,228,216,.58);
    }
  </style>
</head>
<body>
  <div class="cover" id="artboard">
    <img class="hero" src="../../../brand-os/brands/michael-couper/images/identity/michael-couper-hd-hero-canon.png" alt="">
    <div class="shade"></div>
    <div class="seam" aria-hidden="true"></div>
    <div class="mast">
      <div class="name">Counterpoint</div>
      <div class="issue">A Michael Couper editorial concept</div>
    </div>
    <div class="note">Fictional masthead · not real press</div>
    <div class="bottom">
      <div class="label">Cover story</div>
      <h1>Follow the question</h1>
      <p class="deck">A composer-engineer helping independent thinkers see the whole picture before they choose.</p>
    </div>
  </div>
</body>
</html>
