<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Brand Therapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#5A5CF9; --ink:#0a0a10; --paper:#f4f2ee; --muted:rgba(244,242,238,.46); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(130% 120% at 50% -10%, #16161f 0%, var(--ink) 58%, #050509 100%);
    color: var(--paper);
    font-family: "Poppins", system-ui, sans-serif;
    min-height:100%; display:grid; place-items:center;
    overflow:hidden; position:relative;
  }
  .room{ text-align:center; padding: 10vh 24px; max-width: 780px; position:relative; z-index:1; }
  .kicker{
    font-size:11px; font-weight:600; letter-spacing:.34em; text-transform:uppercase;
    color: var(--accent); margin-bottom: 30px;
  }
  h1{
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight:800;
    font-size: clamp(54px, 11.5vw, 122px); line-height:.9; letter-spacing:-.035em;
    user-select:none;
  }
  h1 .dot{ color: var(--accent); display:inline-block; cursor:pointer; transition: transform .25s cubic-bezier(.16,1,.3,1); }
  h1 .dot.pulse{ animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.22);} }
  .line{
    margin-top: 38px; min-height: 3.2em;
    font-size: clamp(16px, 2.3vw, 22px); font-weight:400; line-height:1.45;
    color: var(--muted);
  }
  .cursor{ display:inline-block; width:2px; height:1.05em; background: var(--accent);
    margin-left:4px; vertical-align:-3px; animation: blink 1.05s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .foot{
    position:fixed; bottom:22px; left:0; right:0; text-align:center;
    font-size:10px; letter-spacing:.26em; text-transform:uppercase;
    color: rgba(244,242,238,.2);
  }
  @media (prefers-reduced-motion: reduce){ .cursor,.dot.pulse{ animation:none; } }
</style>
</head>
<body>
  <main class="room">
    <p class="kicker">Off the record</p>
    <h1>Brand Therapy<span class="dot" id="dot">.</span></h1>
    <p class="line"><span id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
  </main>
  <p class="foot">You found a quiet room.</p>
<script>
  var lines = [
    "Tell me about your brand.",
    "And how does that positioning make you feel?",
    "You've been carrying that tagline a long time.",
    "Let's sit with the silence between your words.",
    "There are no wrong answers. Only unclear ones.",
    "We don't have to fix everything today.",
    "Say the thing you actually mean."
  ];
  var typed = document.getElementById('typed');
  var li = 0, ci = 0, deleting = false;
  function tick(){
    var full = lines[li];
    if(!deleting){
      typed.textContent = full.slice(0, ++ci);
      if(ci === full.length){ deleting = true; return setTimeout(tick, 2400); }
    } else {
      typed.textContent = full.slice(0, --ci);
      if(ci === 0){ deleting = false; li = (li + 1) % lines.length; }
    }
    setTimeout(tick, deleting ? 26 : 48);
  }
  tick();

  var dot = document.getElementById('dot');
  var taps = 0;
  dot.addEventListener('click', function(){
    taps++;
    dot.classList.toggle('pulse');
    if(taps === 5){
      lines = ["Okay. You clearly came here for the real thing."];
      li = 0; ci = 0; deleting = false;
    }
  });

  console.log('%cBrand Therapy.', 'color:#5A5CF9;font:800 30px "Bricolage Grotesque",system-ui,sans-serif');
  console.log('%cNothing on the surface here. The work happens behind closed doors.', 'color:#9a9aa6;font:14px Poppins,system-ui,sans-serif');
</script>
</body>
</html>
