<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="brand-fonts" href="" rel="stylesheet">
<style>
  /* Focus Star viewer. One zoomable whole-star scene per brand: five decision
     nodes with completeness rings, a Brand DNA hub, and a slide-in reader pane.
     The compass survives as decoration only: tick rings, a hub rose, and a
     needle that eases toward the focused decision. Consumes the same
     config.js / config.json contract as the retired spinning-compass widget. */
  :root{
    --accent:#5B6168;
    --accent-soft:rgba(90,92,249,.07);
    --accent-glow:rgba(90,92,249,.30);
    --ink:#1A1A2E;
    --muted:rgba(26,26,46,.56);
    --border:rgba(26,26,46,.14);
    --hairline:rgba(26,26,46,.09);
    --soft:rgba(26,26,46,.045);
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --ff-h:system-ui,sans-serif;
    --ff-b:system-ui,sans-serif;
    --title-tt:uppercase;
    --title-w:800;
    --exo:cubic-bezier(0.16,1,0.3,1);
    --dur-fast:.25s; --dur-med:.4s; --dur-slow:.6s;
    --shadow:0 1px 2px rgba(26,26,46,.04),0 8px 30px rgba(26,26,46,.06);
    --shadow-lg:0 10px 50px rgba(26,26,46,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  #stage{position:fixed;inset:0;background:var(--bg)}
  #stage[data-hide-dot="1"] .dot{display:none}
  #stage[data-client="1"] .comp,
  #stage[data-client="1"] .modes{display:none}

  /* ============ star scene ============ */
  #viewport{position:absolute;inset:0;cursor:grab;touch-action:none;overscroll-behavior:none}
  #viewport.grabbing{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #star{position:absolute;left:-700px;top:-700px;width:1400px;height:1400px;overflow:visible;font-family:var(--ff-b)}

  .star-outline{fill:none;stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke}
  .tick{stroke:var(--border);stroke-width:1}
  .tick.major{stroke:var(--muted);stroke-width:1;opacity:.55}
  .tick.pillar{stroke:var(--accent);stroke-width:1.6;opacity:.9}
  .rose{stroke:var(--border);stroke-width:1}
  .rose.major{stroke:var(--accent);opacity:.7}
  #needle{opacity:0;transition:opacity var(--dur-med) var(--exo)}
  #needle.show{opacity:.6}
  #needle line{stroke:var(--accent);stroke-width:1.3}
  #needle path{fill:var(--accent)}

  .center-cap{fill:var(--panel);stroke:var(--border);stroke-width:1.2}
  .cw-eyebrow{font-family:var(--ff-b);font-weight:500;letter-spacing:.24em;text-transform:uppercase;fill:var(--muted)}
  .cw-word{font-family:var(--ff-h);font-weight:var(--title-w);letter-spacing:-.01em;fill:var(--ink)}
  .cw-word .dot{fill:var(--accent)}
  .cw-word.tbd{fill:var(--muted);font-weight:600}
  #centerhit{cursor:pointer}

  .node-g{cursor:pointer}
  .ring-bg{fill:none;stroke:var(--border);stroke-width:3}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset var(--dur-slow) var(--exo)}
  .core{fill:var(--panel);stroke:var(--border);stroke-width:1;transition:stroke var(--dur-fast) var(--exo)}
  .node-g:hover .core{stroke:var(--accent)}
  .node-g.on .core{stroke:var(--accent)}
  .code-t{font-family:var(--ff-h);font-weight:700;letter-spacing:.04em;fill:var(--accent)}
  .pulse{fill:none;stroke:var(--accent);stroke-width:6;opacity:0}
  .node-g.on .pulse{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.10}50%{opacity:.30}}

  .plabel-g{cursor:pointer}
  .plabel-t{font-family:var(--ff-h);font-weight:var(--title-w);letter-spacing:.05em;text-transform:var(--title-tt);fill:var(--ink);transition:fill var(--dur-fast) var(--exo)}
  .plabel-s{font-family:var(--ff-b);font-weight:400;fill:var(--muted)}
  .plabel-g:hover .plabel-t,.plabel-g.on .plabel-t{fill:var(--accent)}

  /* dim everything but the focused decision */
  .fade{transition:opacity var(--dur-med) var(--exo)}
  #world.focusmode .fade:not(.keep){opacity:.12}

  /* ============ wire: node -> pane connector ============ */
  #wire{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:visible;width:100%;height:100%}
  #wire path{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0;transition:opacity var(--dur-med) var(--exo)}
  #wire.show path{opacity:.85}
  #wire circle{fill:var(--accent);opacity:0;transition:opacity var(--dur-med) var(--exo)}
  #wire.show circle{opacity:1}

  /* ============ HUD ============ */
  .hud{position:fixed;z-index:60}
  .s-brand{left:26px;top:22px;max-width:300px}
  .s-brand .wm{font-family:var(--ff-h);font-weight:var(--title-w);font-size:17px;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
  .s-brand .wm .dot{color:var(--accent)}
  .s-brand .meta{font-family:var(--ff-b);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .modes{display:flex;gap:0;margin-top:12px}
  .modes button{border:1px solid var(--border);background:var(--panel);color:var(--muted);font-family:var(--ff-b);font-size:10.5px;letter-spacing:.05em;padding:6px 12px;cursor:pointer;transition:all var(--dur-fast) var(--exo)}
  .modes button + button{border-left-width:0}
  .modes button:hover{color:var(--ink)}
  .modes button.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);position:relative;z-index:1}
  .modes button.active + button{border-left-width:1px}

  .comp{right:24px;top:22px;width:288px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px}
  .comp h3{font-family:var(--ff-b);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .comp .big{font-family:var(--ff-h);font-weight:800;font-size:28px;line-height:1;color:var(--ink);margin-bottom:2px}
  .comp .big .dot{color:var(--accent)}
  .comp .cap{font-family:var(--ff-b);font-size:10.5px;color:var(--muted);margin-bottom:12px}
  .comp .row{display:flex;align-items:center;gap:10px;padding:6.5px 0;cursor:pointer;border-top:1px solid var(--hairline)}
  .comp .row:hover .rn{color:var(--accent)}
  .comp .row.on .rn{color:var(--accent);font-weight:600}
  .comp .rn{font-family:var(--ff-b);font-size:11.5px;color:var(--ink);width:86px;flex-shrink:0;transition:color var(--dur-fast) var(--exo)}
  .comp .bar{flex:1;height:5px;background:var(--soft)}
  .comp .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--dur-slow) var(--exo)}
  .comp .pc{font-family:var(--ff-b);font-size:10px;color:var(--muted);width:32px;text-align:right;flex-shrink:0}

  .pane{right:24px;top:224px;bottom:70px;width:min(40vw,440px);background:var(--panel);border:1px solid var(--ink);box-shadow:var(--shadow-lg);padding:24px 26px 30px;overflow-y:auto;overflow-x:hidden;transform:translateX(26px);opacity:0;pointer-events:none;transition:transform var(--dur-slow) var(--exo),opacity var(--dur-med) var(--exo)}
  .pane.show{transform:none;opacity:1;pointer-events:auto}
  .pane::-webkit-scrollbar{width:8px}.pane::-webkit-scrollbar-thumb{background:var(--border)}
  .pane .eyebrow{position:relative;padding-left:18px;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .pane .eyebrow::before{content:"";position:absolute;left:0;top:1px;width:11px;height:11px;border-top:3px solid var(--accent);border-left:3px solid var(--accent)}
  .pane .pcode{font-family:var(--ff-b);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .pane .pmeta{font-family:var(--ff-b);font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .pane h2{font-family:var(--ff-h);font-weight:var(--title-w);font-size:24px;line-height:1.12;letter-spacing:-.015em;margin-bottom:10px;color:var(--ink)}
  .pane h2 .dot{color:var(--accent)}
  .pane .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .pane .chips span{font-family:var(--ff-b);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .pane .hero{margin:6px 0 12px}
  .pane .hero img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .sec{opacity:0;transform:translateY(8px);transition:opacity .5s var(--exo),transform .5s var(--exo)}
  .pane.show .sec,#stage.flow .sec{opacity:1;transform:none}
  .sec .lab{font-family:var(--ff-b);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:14px;margin:16px 0 9px;border-top:1px solid var(--hairline)}
  .sec.lead .v{font-family:var(--ff-b);font-size:13.5px;line-height:1.62;color:var(--ink)}
  .sec.lead .v strong{font-weight:600}
  .sec p{font-size:12.5px;line-height:1.6;color:var(--ink)}
  .sec ul{list-style:none}
  .sec li{font-size:12.5px;line-height:1.5;padding-left:15px;position:relative;margin:6px 0;color:var(--ink)}
  .sec li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;background:var(--accent)}
  .sec li.out::before{background:var(--panel);border:1.5px solid var(--muted)}
  .shape-chips{display:flex;flex-wrap:wrap;gap:6px}
  .shape-chips span{font-family:var(--ff-b);font-size:10px;letter-spacing:.05em;padding:4px 10px;background:var(--soft);color:var(--ink)}
  .none{font-size:12px;color:var(--muted)}

  /* persona card */
  .persona{border:1px solid var(--border);padding:16px;margin:4px 0 2px}
  .persona .top{display:flex;gap:13px;align-items:center;margin-bottom:11px}
  .persona .avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--soft);display:grid;place-items:center;position:relative}
  .persona .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .persona .avatar .fb{font-family:var(--ff-h);font-weight:800;font-size:20px;color:var(--accent)}
  .persona .role{font-family:var(--ff-h);font-weight:700;font-size:14.5px;line-height:1.2;color:var(--ink)}
  .persona .ctx{font-family:var(--ff-b);font-size:11px;line-height:1.5;color:var(--muted);margin-top:3px}
  .persona .need{font-size:12px;line-height:1.55;color:var(--ink);border-left:2px solid var(--accent);padding-left:11px;margin:10px 0 0}
  .ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .ptags span{font-family:var(--ff-b);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;background:var(--soft);color:var(--muted)}

  /* archetype */
  .arch{border:1px solid var(--border);padding:16px;margin:4px 0 2px}
  .arch .icons{display:flex;gap:8px;margin-bottom:11px}
  .arch .icons:empty{display:none}
  .arch .icons .im{width:52px;height:52px;background:var(--soft);overflow:hidden;display:grid;place-items:center}
  .arch .icons .im img{width:100%;height:100%;object-fit:cover}
  .arch .icons .im .ph{font-family:var(--ff-h);font-weight:800;font-size:18px;color:var(--accent)}
  .arch .aname{font-family:var(--ff-h);font-weight:700;font-size:15px;color:var(--ink)}
  .arch .atype{font-family:var(--ff-b);font-size:10.5px;color:var(--muted);margin-top:3px}
  .arch .traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .arch .traits span{font-family:var(--ff-b);font-size:10px;line-height:1.4;padding:4px 9px;background:var(--soft);color:var(--ink)}

  .insights{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
  .insight{border:1px solid var(--hairline);padding:11px 13px}
  .insight .k{font-family:var(--ff-b);font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .insight p{font-size:11.5px;line-height:1.5;color:var(--ink)}

  .mood{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .mood .mi{aspect-ratio:4/3;background:var(--soft);overflow:hidden}
  .mood .mi img{width:100%;height:100%;object-fit:cover;display:block}

  .ctrls{right:24px;bottom:22px;display:flex;gap:4px;z-index:61}
  .ctrls button{border:1px solid var(--border);background:var(--panel);color:var(--ink);width:34px;height:32px;cursor:pointer;font-family:var(--ff-b);font-size:15px;transition:all var(--dur-fast) var(--exo)}
  .ctrls button:hover{border-color:var(--accent);color:var(--accent)}
  .ctrls .fit{width:auto;padding:0 14px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

  .loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--ff-b);font-size:13px;color:var(--muted);background:var(--bg);z-index:90;padding:24px}

  /* mid-size embeds: keep the scene, tighten the HUD */
  @media (max-width:1080px){
    .comp{width:238px}
    .comp .rn{width:74px}
    .pane{width:min(46vw,420px);top:214px}
  }

  /* ============ narrow embed (phone / narrow iframe): one scroll flow ============ */
  @media (max-width:820px){
    html,body{overflow:visible;height:auto}
    body{overflow:visible}
    #stage{position:static;height:auto;display:flex;flex-direction:column}
    #viewport{position:static;height:auto;cursor:default;touch-action:auto}
    #world{position:static;transform:none !important}
    #star{position:static;left:auto;top:auto;width:100%;height:auto;display:block;max-height:80vh}
    #wire,.ctrls{display:none}
    #world.focusmode .fade:not(.keep){opacity:1}
    .hud{position:static}
    .s-brand{order:0;max-width:none;padding:18px 20px 4px}
    .comp{order:2;width:auto;margin:0 20px;border:0;border-top:1px solid var(--border);box-shadow:none;padding:14px 0 6px}
    .pane{order:3;position:static;width:auto;transform:none;opacity:1;pointer-events:auto;border:0;border-top:1px solid var(--border);box-shadow:none;margin:10px 0 0;padding:20px 20px 34px;overflow:visible}
    .starwrap{order:1;padding:2px 8px 0}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="starwrap" id="starwrap">
    <div id="viewport">
      <div id="world"><svg id="star" viewBox="-700 -700 1400 1400" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
  </div>
  <svg id="wire" aria-hidden="true"><path/><circle r="3.5"/></svg>
  <header class="hud s-brand">
    <div class="wm" id="brand-name"></div>
    <div class="meta">Focus Star &middot; Brand Therapy OS</div>
    <div class="modes" id="modes" hidden>
      <button id="btn-case" type="button">Case study</button>
      <button id="btn-guide" type="button">Guide</button>
    </div>
  </header>
  <aside class="hud comp" id="comp" aria-label="Strategy completeness"></aside>
  <section class="hud pane" id="pane" aria-live="polite"></section>
  <div class="hud ctrls">
    <button type="button" id="z-out" aria-label="Zoom out">&minus;</button>
    <button type="button" id="z-in" aria-label="Zoom in">+</button>
    <button type="button" class="fit" id="z-fit">Whole star</button>
  </div>
</div>
<div class="loading" id="loading">Loading Focus Star&hellip;</div>

<script src="./config.js"></script>
<script>
'use strict';
const CONFIG_PATH='./config.json';
const NS='http://www.w3.org/2000/svg';

/* ============ geometry ============ */
const STEP=72, STAR_R=278, STAR_INNER=278*0.38, NODE_R=300, LABEL_R=418, HUB_R=78;
const TICK_OUT=486;
const ang=i=>i*STEP;
function pt(a,r){const rad=(a-90)*Math.PI/180;return{x:Math.cos(rad)*r,y:Math.sin(rad)*r};}

/* text sizes per layout: SVG text must be larger in the narrow fit so it stays
   legible when the whole star is ~340px wide */
const SIZES={
  desk:{ring:33,core:24,code:13,label:14.5,sub:11,subChars:30,cwWord:23,cwEyebrow:8.5,labelGap:19},
  narrow:{ring:46,core:36,code:24,label:31,sub:20,subChars:22,cwWord:34,cwEyebrow:14,labelGap:40},
};

let SOURCE=null, BRAND={}, PILLARS=[], CENTER='', mode='case', focusedIdx=-1;
let narrow=window.matchMedia('(max-width:820px)').matches;

/* ============ helpers ============ */
function escapeHTML(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function truncate(value,max){const t=String(value||'');return t.length>max?t.slice(0,max-1).trimEnd()+'…':t;}
/* Config prose arrives HTML-escaped from the builder; decode before using it
   as SVG textContent (innerHTML paths resolve entities on their own). */
function decodeEntities(value){const d=document.createElement('textarea');d.innerHTML=String(value||'');return d.value;}
function resolveAssetPath(path=''){
  const value=String(path);
  return value.startsWith('assets/')?`../${value.slice('assets/'.length)}`:value;
}
function hexToRgb(hex){
  const m=String(hex||'').trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m) return null;
  let h=m[1]; if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}
function rgba(hex,a){const c=hexToRgb(hex);return c?`rgba(${c.r},${c.g},${c.b},${a})`:'';}

/* ============ config ============ */
function normalizePanel(panel){
  const src=panel||{};
  return{
    desc:src.desc||'',
    apply:src.apply||'',
    impacts:Array.isArray(src.impacts)?src.impacts.filter(Boolean):[],
    focus:(src.focus&&typeof src.focus==='object')?src.focus:null,
    cards:Array.isArray(src.cards)?src.cards:[],
    persona:(src.persona&&typeof src.persona==='object')?src.persona:null,
    archetype:(src.archetype&&typeof src.archetype==='object')?src.archetype:null,
    archetypeAssets:(src.archetypeAssets&&typeof src.archetypeAssets==='object')?src.archetypeAssets:null,
    moodboard:Array.isArray(src.moodboard)?src.moodboard:[],
    details:(src.details&&typeof src.details==='object')?src.details:{},
  };
}
function normalizeConfig(config){
  if(!config||!Array.isArray(config.pillars)||!config.pillars.length){
    throw new Error('config is missing pillars');
  }
  const pillars=config.pillars.map((p,i)=>({
    id:p.id||`p${i+1}`,
    code:String(p.code||`P${i+1}`).toUpperCase(),
    title:p.title||`Decision ${i+1}`,
    eyebrow:p.eyebrow||'',
    image:(p.image&&p.image.path)?p.image:null,
    guide:normalizePanel(p.guide),
    case:normalizePanel(p.case),
  }));
  return{
    brand:config.brand||{},
    visual:config.visual||{},
    center:String(config.center||'').trim(),
    pillars,
    defaultTab:config.defaultTab==='guide'?'guide':'case',
    clientMode:config.clientMode===true,
  };
}

/* ============ theming ============ */
const WEB_SAFE=new Set(['georgia','arial','helvetica','helvetica neue','times','times new roman','verdana','tahoma','trebuchet ms','courier','courier new','system-ui','sans-serif','serif']);
function applyTheme(data){
  const root=document.documentElement.style;
  const brand=data.brand||{}, visual=data.visual||{};
  const accent=brand.accentColor;
  if(accent){
    root.setProperty('--accent',accent);
    const soft=rgba(accent,.07), glow=rgba(accent,.30);
    if(soft) root.setProperty('--accent-soft',soft);
    if(glow) root.setProperty('--accent-glow',glow);
  }
  const ink=brand.inkColor;
  if(ink){
    root.setProperty('--ink',ink);
    const muted=rgba(ink,.56), border=rgba(ink,.14), hairline=rgba(ink,.09), soft=rgba(ink,.045);
    if(muted) root.setProperty('--muted',muted);
    if(border) root.setProperty('--border',border);
    if(hairline) root.setProperty('--hairline',hairline);
    if(soft) root.setProperty('--soft',soft);
    const sh=hexToRgb(ink);
    if(sh){
      root.setProperty('--shadow',`0 1px 2px rgba(${sh.r},${sh.g},${sh.b},.04),0 8px 30px rgba(${sh.r},${sh.g},${sh.b},.06)`);
      root.setProperty('--shadow-lg',`0 10px 50px rgba(${sh.r},${sh.g},${sh.b},.10)`);
    }
  }
  if(visual.background) root.setProperty('--bg',visual.background);
  const panel=visual.dialBackground||visual.background;
  if(panel) root.setProperty('--panel',panel);
  root.setProperty('--title-tt',visual.titleTransform||'uppercase');
  root.setProperty('--title-w',String(visual.titleWeight||800));
  document.getElementById('stage').dataset.hideDot=visual.hideTitleDot?'1':'0';

  const fonts=visual.fonts||{};
  if(fonts.heading) root.setProperty('--ff-h',`'${fonts.heading}',system-ui,sans-serif`);
  if(fonts.body) root.setProperty('--ff-b',`'${fonts.body}',system-ui,sans-serif`);
  const families=[...new Set([fonts.heading,fonts.body].filter(Boolean))]
    .filter(f=>!WEB_SAFE.has(String(f).toLowerCase()));
  if(families.length){
    const query=families.map(f=>`family=${encodeURIComponent(f).replace(/%20/g,'+')}:wght@400;500;600;700;800`).join('&');
    document.getElementById('brand-fonts').href=`https://fonts.googleapis.com/css2?${query}&display=swap`;
  }
}

/* ============ completeness ============ */
/* one uniform 10-point checklist per decision, computed from the case panel */
function filledCount(p){
  const c=p.case, d=c.details||{};
  const has=k=>{
    const v=d[k];
    if(Array.isArray(v)) return v.some(item=>String(item||'').trim());
    return !!String(v||'').trim();
  };
  const focus=c.focus||{};
  const checks=[
    !!c.desc.trim(),
    !!String(focus.headline||'').trim(),
    !!String(focus.support||'').trim()||(Array.isArray(focus.chips)&&focus.chips.length>0),
    !!c.apply.trim(),
    has('Rules in'),
    has('Rules out'),
    has('Proof required'),
    has('AI rule'),
    has('Strategic position'),
    has('Compass'),
  ];
  return checks.filter(Boolean).length;
}
function overallPct(){
  if(!PILLARS.length) return 0;
  return Math.round(PILLARS.reduce((sum,p)=>sum+filledCount(p),0)/PILLARS.length*10);
}

/* ============ star scene build (all-SVG so both layouts stay crisp) ============ */
const starSvg=document.getElementById('star');
const world=document.getElementById('world');
function svgEl(tag,attrs,cls){
  const el=document.createElementNS(NS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  if(cls) el.setAttribute('class',cls);
  return el;
}
function dotSuffix(){return document.getElementById('stage').dataset.hideDot!=='1';}
function splitCenterWord(word){
  if(!word) return [];
  const parts=word.split(/\s+/).filter(Boolean);
  if(parts.length<2||word.length<=9) return [word];
  const mid=Math.ceil(parts.length/2);
  return [parts.slice(0,mid).join(' '),parts.slice(mid).join(' ')];
}

/* star sublabels: guide mode shows the generic descriptor, case mode shows
   the brand's short decision line (focus headline) */
function subTextFor(p){
  if(mode==='case'&&p.case&&p.case.focus&&p.case.focus.headline){
    const h=decodeEntities(p.case.focus.headline).trim();
    if(h) return h;
  }
  return decodeEntities(p.eyebrow||'');
}
function wrapTwo(str,max){
  const words=String(str).split(/\s+/).filter(Boolean);
  let l1='',i=0;
  while(i<words.length){
    const cand=l1?l1+' '+words[i]:words[i];
    if(cand.length>max&&l1) break;
    l1=cand;i++;
  }
  let l2=words.slice(i).join(' ');
  if(l2.length>max) l2=l2.slice(0,Math.max(1,max-1)).replace(/\s+\S*$/,'')+'…';
  return l2?[l1,l2]:[l1];
}
function appendSub(lab,p,S){
  const raw=subTextFor(p);
  if(!S.sub||!raw) return;
  wrapTwo(raw,S.subChars||30).forEach((line,li)=>{
    const s=svgEl('text',{x:0,y:S.labelGap+li*S.sub*1.4,'text-anchor':'middle','font-size':S.sub},'plabel-s');
    s.textContent=line;
    lab.appendChild(s);
  });
}

function buildScene(){
  const S=narrow?SIZES.narrow:SIZES.desk;
  starSvg.innerHTML='';

  /* compass decoration: outer tick ring (fine 6deg, major 18deg, accent at the
     five decision bearings) */
  const ticks=svgEl('g',{},'fade');
  for(let a=0;a<360;a+=6){
    const isPillar=a%STEP===0, isMajor=a%18===0;
    const r0=isPillar?TICK_OUT-24:isMajor?TICK_OUT-15:TICK_OUT-8;
    const p0=pt(a,r0), p1=pt(a,TICK_OUT);
    ticks.appendChild(svgEl('line',{x1:p0.x,y1:p0.y,x2:p1.x,y2:p1.y},
      'tick'+(isPillar?' pillar':isMajor?' major':'')));
  }
  starSvg.appendChild(ticks);

  /* star outline */
  let points=[];
  for(let i=0;i<5;i++){
    const o=pt(ang(i),STAR_R), v=pt(ang(i)+36,STAR_INNER);
    points.push(`${o.x.toFixed(1)},${o.y.toFixed(1)}`,`${v.x.toFixed(1)},${v.y.toFixed(1)}`);
  }
  starSvg.appendChild(svgEl('polygon',{points:points.join(' ')},'star-outline fade'));

  /* needle: eases toward the focused decision, base hidden under the hub */
  const needle=svgEl('g',{id:'needle'});
  const tip=NODE_R-S.ring-16;
  needle.appendChild(svgEl('line',{x1:0,y1:0,x2:0,y2:-(tip-14)}));
  needle.appendChild(svgEl('path',{d:`M0 ${-tip} L6 ${-(tip-16)} L0 ${-(tip-11)} L-6 ${-(tip-16)} Z`}));
  starSvg.appendChild(needle);

  /* hub: compass rose + Brand DNA word (Center is retired terminology) */
  const hub=svgEl('g',{id:'centerhit'});
  hub.appendChild(svgEl('circle',{cx:0,cy:0,r:HUB_R+4},'center-cap'));
  const rose=svgEl('g',{});
  for(let a=0;a<360;a+=12){
    const isMajor=a%STEP===0;
    const p0=pt(a,isMajor?HUB_R-10:HUB_R-6), p1=pt(a,HUB_R-1);
    rose.appendChild(svgEl('line',{x1:p0.x,y1:p0.y,x2:p1.x,y2:p1.y},'rose'+(isMajor?' major':'')));
  }
  hub.appendChild(rose);
  const word=decodeEntities(CENTER||'');
  const wordSize=word.length>14?S.cwWord*0.7:word.length>9?S.cwWord*0.84:S.cwWord;
  const lines=splitCenterWord(word);
  const twoLine=lines.length>1;
  const eyebrow=svgEl('text',{x:0,y:twoLine?-(wordSize*1.30):-(wordSize*0.98),'text-anchor':'middle','font-size':S.cwEyebrow},'cw-eyebrow');
  eyebrow.textContent='Brand DNA';
  hub.appendChild(eyebrow);
  const wordEl=svgEl('text',{x:0,y:0,'text-anchor':'middle','font-size':wordSize},'cw-word'+(word?'':' tbd'));
  if(!word){
    const tspan=svgEl('tspan',{x:0,dy:wordSize*0.40});
    tspan.textContent='TBD';
    wordEl.appendChild(tspan);
  }else{
    lines.forEach((line,li)=>{
      const tspan=svgEl('tspan',{x:0,dy:li===0?(twoLine?-(wordSize*0.14):wordSize*0.40):wordSize*1.06});
      tspan.textContent=line;
      wordEl.appendChild(tspan);
      if(li===lines.length-1&&dotSuffix()&&!/[?!.]$/.test(word)){
        const dot=svgEl('tspan',{},'dot');
        dot.textContent='.';
        wordEl.appendChild(dot);
      }
    });
  }
  hub.appendChild(wordEl);
  hub.addEventListener('click',ev=>{ev.stopPropagation();focusPillarId('promise');});
  starSvg.appendChild(hub);

  /* decision nodes + labels */
  PILLARS.forEach((p,i)=>{
    const N=pt(ang(i),NODE_R), L=pt(ang(i),LABEL_R);
    const filled=filledCount(p), C=2*Math.PI*S.ring, off=C*(1-filled/10);

    const node=svgEl('g',{transform:`translate(${N.x.toFixed(1)} ${N.y.toFixed(1)})`},'node-g fade');
    node.dataset.idx=i;
    node.appendChild(svgEl('circle',{cx:0,cy:0,r:S.ring+9},'pulse'));
    node.appendChild(svgEl('circle',{cx:0,cy:0,r:S.ring},'ring-bg'));
    node.appendChild(svgEl('circle',{cx:0,cy:0,r:S.ring,'stroke-dasharray':C.toFixed(1),'stroke-dashoffset':off.toFixed(1),transform:'rotate(-90)'},'ring-fg'));
    node.appendChild(svgEl('circle',{cx:0,cy:0,r:S.core},'core'));
    const code=svgEl('text',{x:0,y:S.code*0.36,'text-anchor':'middle','font-size':S.code},'code-t');
    code.textContent=p.code;
    node.appendChild(code);
    node.appendChild(svgEl('circle',{cx:0,cy:0,r:S.ring+14,fill:'transparent',stroke:'none'}));
    node.addEventListener('click',ev=>{ev.stopPropagation();focusPillar(i);});
    starSvg.appendChild(node);

    const lab=svgEl('g',{transform:`translate(${L.x.toFixed(1)} ${L.y.toFixed(1)})`},'plabel-g fade');
    lab.dataset.idx=i;
    const hit=svgEl('rect',{x:-95,y:-S.label*1.2,width:190,height:S.label*1.2+S.labelGap+10+(S.sub?S.sub*1.5:0),fill:'transparent',stroke:'none'});
    lab.appendChild(hit);
    const t=svgEl('text',{x:0,y:0,'text-anchor':'middle','font-size':S.label},'plabel-t');
    t.textContent=p.title;
    lab.appendChild(t);
    appendSub(lab,p,S);
    lab.addEventListener('click',ev=>{ev.stopPropagation();focusPillar(i);});
    starSvg.appendChild(lab);
  });
}

/* ============ needle animation ============ */
let needleAng=0, needleRaf=null;
function pointNeedle(i){
  const el=document.getElementById('needle');
  if(!el) return;
  el.classList.add('show');
  const target=ang(i);
  cancelAnimationFrame(needleRaf);
  const from=needleAng;
  const delta=((target-from)%360+540)%360-180;
  const t0=performance.now(), dur=520;
  const ez=t=>t>=1?1:1-Math.pow(2,-10*t);
  (function step(now){
    const t=Math.min(1,(now-t0)/dur);
    needleAng=from+delta*ez(t);
    el.setAttribute('transform',`rotate(${needleAng.toFixed(2)})`);
    if(t<1) needleRaf=requestAnimationFrame(step);
  })(t0);
}
function hideNeedle(){
  const el=document.getElementById('needle');
  if(el) el.classList.remove('show');
}

/* ============ camera (desktop scene only) ============ */
const vp=document.getElementById('viewport');
const tf={x:0,y:0,k:1};
let camRaf=null;
function clampK(k){return Math.max(.3,Math.min(3,k));}
function applyCam(){
  if(narrow) return;
  world.style.transform=`translate(${tf.x}px,${tf.y}px) scale(${tf.k})`;
  if(focusedIdx>=0) updateWire();
}
function tween(to,dur=620,done){
  cancelAnimationFrame(camRaf);
  const f={...tf}, t0=performance.now();
  const ez=t=>t>=1?1:1-Math.pow(2,-10*t);
  (function step(now){
    const t=Math.min(1,(now-t0)/dur), e=ez(t);
    tf.x=f.x+(to.x-f.x)*e; tf.y=f.y+(to.y-f.y)*e; tf.k=f.k+(to.k-f.k)*e;
    applyCam();
    if(t<1) camRaf=requestAnimationFrame(step); else if(done) done();
  })(t0);
}
function fitTarget(){
  const half=575;
  const compW=window.innerWidth>1080?310:250;
  const availW=Math.max(window.innerWidth-compW-48,300);
  const availH=Math.max(window.innerHeight-40,300);
  const k=clampK(Math.min(availW,availH)/(2*half)*0.94);
  return{x:(window.innerWidth-compW)/2,y:window.innerHeight/2,k};
}
function fit(instant){
  const t=fitTarget();
  if(instant){tf.x=t.x;tf.y=t.y;tf.k=t.k;applyCam();}
  else tween(t);
}
function zoomBy(f){
  if(narrow) return;
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  const k1=clampK(tf.k*f), s=k1/tf.k;
  tf.x=cx-(cx-tf.x)*s; tf.y=cy-(cy-tf.y)*s; tf.k=k1;
  applyCam();
}

/* wire from focused node to the pane */
const wire=document.getElementById('wire');
const wirePath=wire.querySelector('path'), wireDot=wire.querySelector('circle');
function nodeScreen(i){const N=pt(ang(i),NODE_R);return{x:N.x*tf.k+tf.x,y:N.y*tf.k+tf.y};}
function updateWire(){
  if(narrow||focusedIdx<0) return;
  const r=document.getElementById('pane').getBoundingClientRect();
  const sc=nodeScreen(focusedIdx), tx=r.left, ty=r.top+44;
  const dx=Math.max(Math.abs(tx-sc.x)*0.4,60);
  wirePath.setAttribute('d',`M${sc.x},${sc.y} C${sc.x+dx},${sc.y} ${tx-dx},${ty} ${tx},${ty}`);
  wireDot.setAttribute('cx',sc.x); wireDot.setAttribute('cy',sc.y);
}

/* ============ reader pane ============ */
/* Config strings arrive HTML-escaped from the builder (html.escape at emit
   time), so prose fields are inserted as-is; escapeHTML() guards values that
   land in attributes or were not builder-escaped. */
function listHTML(items,outTone){
  const clean=(items||[]).map(v=>String(v||'').trim()).filter(Boolean);
  if(!clean.length) return '';
  return `<ul>${clean.map(v=>`<li${outTone?' class="out"':''}>${v}</li>`).join('')}</ul>`;
}
function secHTML(label,body,index,extraClass){
  if(!body) return '';
  return `<div class="sec${extraClass?' '+extraClass:''}" style="transition-delay:${(0.04*index+0.05).toFixed(2)}s"><div class="lab">${escapeHTML(label)}</div>${body}</div>`;
}
function personaHTML(persona){
  if(!persona||!persona.role) return '';
  const img=persona.image&&persona.image.path
    ?`<img src="${escapeHTML(resolveAssetPath(persona.image.path))}" alt="${escapeHTML(persona.image.alt||persona.role)}" onerror="this.remove()">`
    :'';
  const initial=escapeHTML(String(persona.role).trim().charAt(0)||'P');
  const context=persona.quote||persona.tagline||persona.context||'';
  const insights=[
    ['Motivation',persona.rationalMotivation],
    ['Pain',persona.painPoint],
    ['Trigger',persona.decisionTrigger||(Array.isArray(persona.buyingCriteria)?persona.buyingCriteria.slice(0,3).join(', '):'')],
  ].filter(item=>item[1]);
  return `<div class="persona">
    <div class="top">
      <div class="avatar"><span class="fb">${initial}</span>${img}</div>
      <div><div class="role">${persona.role}</div>${context?`<div class="ctx">${context}</div>`:''}</div>
    </div>
    ${persona.need?`<p class="need">${persona.need}</p>`:''}
    ${(persona.tags&&persona.tags.length)?`<div class="ptags">${persona.tags.slice(0,6).map(t=>`<span>${t}</span>`).join('')}</div>`:''}
  </div>
  ${insights.length?`<div class="insights">${insights.map(([k,v])=>`<div class="insight"><div class="k">${k}</div><p>${truncate(v,230)}</p></div>`).join('')}</div>`:''}`;
}
function archetypeHTML(data){
  const a=data.archetype;
  if(!a||!a.primary||!a.primary.name) return '';
  const assets=data.archetypeAssets||{};
  const icons=[assets.primary,...(assets.secondary||[])].filter(Boolean);
  const secondary=(a.secondary||[]).filter(item=>item&&item.name);
  const traits=[a.primary.essence,...secondary.map(item=>item.essence)].filter(Boolean);
  const typeLine=[
    a.primary.weight?`Primary ${Math.round(a.primary.weight*100)}%`:'Primary',
    secondary.length?`Secondary ${secondary.map(item=>item.name).join(' + ')}`:'',
  ].filter(Boolean).join(' · ');
  const moodboard=(data.moodboard||[]).slice(0,4);
  return `<div class="arch">
    ${icons.length?`<div class="icons">${icons.map(item=>`<div class="im">${item.icon?`<img src="${escapeHTML(resolveAssetPath(item.icon))}" alt="${escapeHTML(item.alt||item.name||'Archetype')}">`:'<span class="ph">*</span>'}</div>`).join('')}</div>`:''}
    <div class="aname">${a.primary.name}</div>
    <div class="atype">${typeLine}</div>
    ${traits.length?`<div class="traits">${traits.map(t=>`<span>${truncate(t,70)}</span>`).join('')}</div>`:''}
  </div>
  ${moodboard.length?`<div class="mood">${moodboard.map(item=>`<div class="mi"><img src="${escapeHTML(resolveAssetPath(item.path))}" alt="${escapeHTML(item.alt||item.role||'Moodboard reference')}"></div>`).join('')}</div>`:''}`;
}
const DETAIL_ORDER=[
  ['Strategic position','Position',false],
  ['Compass','Compass',false],
  ['Rules in','Rules in',false],
  ['Rules out','Rules out',true],
  ['Proof required','Proof required',false],
  ['AI rule','AI instructions',false],
  ['Workshop keywords','Workshop keywords',false],
  ['Slider cues','Slider cues',false],
  ['Not core','Not the brand core',true],
  ['Image signal','Image signal',false],
];
function paneHTML(p){
  const data=mode==='case'?p.case:p.guide;
  const filled=filledCount(p);
  const dot=dotSuffix()?'<span class="dot">.</span>':'';
  let n=0;
  const paneMeta=SOURCE.clientMode?'Brand strategy':(mode==='case'?`${filled}/10 defined`:'Method guide');
  let html=`<div class="eyebrow"><span class="pcode">${escapeHTML(p.code)} · ${escapeHTML(p.title)}</span><span class="pmeta">${paneMeta}</span></div>`;

  if(mode==='guide'){
    html+=`<h2>${escapeHTML(p.title)}${dot}</h2>`;
    if(data.desc) html+=secHTML('What it is',`<div class="v">${data.desc}</div>`,n++,'lead');
    if(data.impacts.length) html+=secHTML('What it shapes',listHTML(data.impacts),n++);
    return html;
  }

  const focus=data.focus||{};
  const headline=String(focus.headline||'').trim();
  html+=`<h2>${headline||escapeHTML(p.title)}${dot}</h2>`;
  const chips=Array.isArray(focus.chips)?focus.chips.filter(Boolean).slice(0,5):[];
  if(chips.length) html+=`<div class="chips">${chips.map(c=>`<span>${c}</span>`).join('')}</div>`;
  if(p.image) html+=`<div class="hero"><img src="${escapeHTML(resolveAssetPath(p.image.path))}" alt="${escapeHTML(p.image.alt||p.title)}" onerror="this.parentElement.remove()"></div>`;
  const lead=String(data.desc||'').trim();
  if(lead) html+=secHTML(SOURCE.clientMode?'What it means':String(focus.label||'Decision'),`<div class="v">${lead}</div>`,n++,'lead');

  if(p.id==='people'&&data.persona){
    const block=personaHTML(data.persona);
    if(block) html+=secHTML('Persona',block,n++);
  }
  if(p.id==='personality'){
    const block=archetypeHTML(data);
    if(block) html+=secHTML('Archetype',block,n++);
  }

  const details=data.details||{};
  const shown=new Set();
  const clientLabels={
    'Strategic position':'What it means',
    'Compass':'Guiding principle',
    'Rules in':'Do',
    'Rules out':'Avoid',
    'Proof required':'Proof to use',
    'AI rule':'Use with AI',
  };
  for(const [key,label,outTone] of DETAIL_ORDER){
    const value=details[key];
    const items=Array.isArray(value)?value:(value?[value]:[]);
    const clean=items.map(v=>String(v||'').trim()).filter(Boolean);
    if(!clean.length) continue;
    if(clean.length===1&&(clean[0]===lead||clean[0]===headline)) continue;
    html+=secHTML(SOURCE.clientMode?(clientLabels[key]||label):label,listHTML(clean,outTone),n++);
    shown.add(key);
  }
  if(!shown.has('Compass')&&String(focus.support||'').trim()&&focus.support!==lead){
    html+=secHTML(SOURCE.clientMode?'Guiding principle':'Compass',`<p>${focus.support}</p>`,n++);
  }
  const applyLabel=SOURCE.clientMode?'Put it to work':(p.id==='people'?'Audience fit':p.id==='personality'?'Operating rule':'How to use');
  if(data.apply&&data.apply!==lead) html+=secHTML(applyLabel,`<p>${data.apply}</p>`,n++);
  if(data.impacts.length) html+=secHTML(SOURCE.clientMode?'Where it shows up':'Shapes',`<div class="shape-chips">${data.impacts.map(v=>`<span>${v}</span>`).join('')}</div>`,n++);
  return html;
}

/* ============ focus / unfocus ============ */
function markActive(i){
  starSvg.querySelectorAll('.node-g').forEach(n=>{
    const on=+n.dataset.idx===i;
    n.classList.toggle('on',on); n.classList.toggle('keep',on);
  });
  starSvg.querySelectorAll('.plabel-g').forEach(l=>{
    const on=+l.dataset.idx===i;
    l.classList.toggle('on',on); l.classList.toggle('keep',on);
  });
  document.querySelectorAll('.comp .row').forEach(r=>r.classList.toggle('on',+r.dataset.idx===i));
}
function positionPane(){
  if(narrow) return;
  const pane=document.getElementById('pane');
  const bottom=document.getElementById('comp').getBoundingClientRect().bottom;
  pane.style.top=`${Math.max(224,Math.round(bottom+14))}px`;
}
function renderPane(i){
  const pane=document.getElementById('pane');
  positionPane();
  pane.innerHTML=paneHTML(PILLARS[i]);
  pane.scrollTop=0;
}
function focusPillar(i,opts={}){
  if(i<0||i>=PILLARS.length) return;
  focusedIdx=i;
  document.getElementById('stage').dataset.pillar=PILLARS[i].id;
  markActive(i);
  renderPane(i);
  pointNeedle(i);
  if(narrow){
    if(!opts.silent) document.getElementById('pane').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  world.classList.add('focusmode');
  document.getElementById('pane').classList.add('show');
  wire.classList.add('show');
  const N=pt(ang(i),NODE_R);
  const k=clampK(1.18), sx=window.innerWidth*0.30, sy=window.innerHeight*0.46;
  tween({k,x:sx-N.x*k,y:sy-N.y*k});
}
function focusPillarId(id){
  const i=PILLARS.findIndex(p=>p.id===id);
  if(i>=0) focusPillar(i);
}
function unfocus(){
  if(narrow) return;
  focusedIdx=-1;
  delete document.getElementById('stage').dataset.pillar;
  world.classList.remove('focusmode');
  starSvg.querySelectorAll('.node-g,.plabel-g').forEach(n=>n.classList.remove('on','keep'));
  document.querySelectorAll('.comp .row').forEach(r=>r.classList.remove('on'));
  document.getElementById('pane').classList.remove('show');
  wire.classList.remove('show');
  hideNeedle();
  fit();
}

/* ============ mode toggle ============ */
function setMode(m){
  mode=m==='guide'?'guide':'case';
  document.getElementById('stage').dataset.mode=mode;
  document.getElementById('btn-case').classList.toggle('active',mode==='case');
  document.getElementById('btn-guide').classList.toggle('active',mode==='guide');
  const S=narrow?SIZES.narrow:SIZES.desk;
  document.querySelectorAll('.plabel-g').forEach(g=>{
    g.querySelectorAll('.plabel-s').forEach(el=>el.remove());
    appendSub(g,PILLARS[+g.dataset.idx],S);
  });
  if(focusedIdx>=0) renderPane(focusedIdx);
}

/* ============ input ============ */
let down=null, moved=false;
vp.addEventListener('pointerdown',e=>{
  if(narrow) return;
  if(e.target.closest('.node-g,.plabel-g,#centerhit')) return;
  down={x:e.clientX,y:e.clientY,tx:tf.x,ty:tf.y}; moved=false;
  vp.classList.add('grabbing'); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove',e=>{
  if(!down) return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
  tf.x=down.tx+dx; tf.y=down.ty+dy; applyCam();
});
vp.addEventListener('pointerup',()=>{down=null;vp.classList.remove('grabbing');});
vp.addEventListener('pointercancel',()=>{down=null;vp.classList.remove('grabbing');});
vp.addEventListener('click',e=>{
  if(narrow||moved) return;
  if(focusedIdx>=0&&!e.target.closest('.node-g,.plabel-g,#centerhit')) unfocus();
});
vp.addEventListener('wheel',e=>{
  if(narrow) return;
  e.preventDefault();
  const r=vp.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  const k1=clampK(tf.k*Math.exp(-e.deltaY*0.0016)), s=k1/tf.k;
  tf.x=cx-(cx-tf.x)*s; tf.y=cy-(cy-tf.y)*s; tf.k=k1;
  applyCam();
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&focusedIdx>=0) unfocus();
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const dir=e.key==='ArrowRight'?1:-1;
    const next=focusedIdx<0?(dir>0?0:PILLARS.length-1):(focusedIdx+dir+PILLARS.length)%PILLARS.length;
    focusPillar(next);
  }
});
document.getElementById('z-in').addEventListener('click',()=>zoomBy(1.22));
document.getElementById('z-out').addEventListener('click',()=>zoomBy(.82));
document.getElementById('z-fit').addEventListener('click',unfocus);
document.getElementById('btn-case').addEventListener('click',()=>setMode('case'));
document.getElementById('btn-guide').addEventListener('click',()=>setMode('guide'));

/* ============ layout switching ============ */
function applyLayout(){
  const wasNarrow=narrow;
  narrow=window.matchMedia('(max-width:820px)').matches;
  document.getElementById('stage').classList.toggle('flow',narrow);
  if(narrow!==wasNarrow||!starSvg.childNodes.length){
    buildScene();
    if(focusedIdx>=0){markActive(focusedIdx);pointNeedle(focusedIdx);}
  }
  if(narrow){
    world.style.transform='';
    document.getElementById('pane').style.top='';
    if(focusedIdx<0&&PILLARS.length) focusPillar(0,{silent:true});
  }else if(focusedIdx>=0){
    positionPane();
    const N=pt(ang(focusedIdx),NODE_R);
    const k=clampK(1.18);
    tf.k=k; tf.x=window.innerWidth*0.30-N.x*k; tf.y=window.innerHeight*0.46-N.y*k;
    world.classList.add('focusmode');
    document.getElementById('pane').classList.add('show');
    wire.classList.add('show');
    applyCam();
  }else{
    fit(true);
  }
}
let resizeT=0;
addEventListener('resize',()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(applyLayout,120);
});

/* ============ boot ============ */
async function init(){
  try{
    let raw=window.FOCUS_STAR_CONFIG||null;
    if(!raw){
      const response=await fetch(CONFIG_PATH,{cache:'no-store'});
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      raw=await response.json();
    }
    SOURCE=normalizeConfig(raw);
    BRAND=SOURCE.brand; PILLARS=SOURCE.pillars; CENTER=SOURCE.center;
    applyTheme(SOURCE);
    document.getElementById('stage').dataset.client=SOURCE.clientMode?'1':'0';

    const name=String(BRAND.name||'Focus Star');
    document.getElementById('brand-name').innerHTML=
      escapeHTML(name)+(/[.!?]$/.test(name)?'':'<span class="dot">.</span>');
    document.getElementById('btn-case').textContent=
      decodeEntities(BRAND.shortName||BRAND.name||'Case study');

    const params=new URLSearchParams(window.location.search);
    const urlMode=params.get('mode');
    mode=SOURCE.clientMode?'case':((urlMode==='case'||urlMode==='guide')?urlMode:SOURCE.defaultTab);
    document.getElementById('modes').hidden=SOURCE.clientMode;
    setMode(mode);

    if(!SOURCE.clientMode) buildComp();
    applyLayout();
    document.getElementById('loading').style.display='none';

    const hashIdx=PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
    if(narrow){
      focusPillar(hashIdx>=0?hashIdx:0,{silent:true});
    }else if(hashIdx>=0){
      fit(true);
      setTimeout(()=>focusPillar(hashIdx),80);
    }else{
      const t=fitTarget();
      tf.x=t.x; tf.y=t.y; tf.k=t.k*0.84; applyCam();
      tween(t,760);
    }
    window.addEventListener('hashchange',()=>{
      const idx=PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
      if(idx>=0&&idx!==focusedIdx) focusPillar(idx);
    });
  }catch(error){
    const loading=document.getElementById('loading');
    loading.style.display='grid';
    loading.textContent=`Focus Star could not load ${CONFIG_PATH}: ${error.message}`;
  }
}
init();
</script>
