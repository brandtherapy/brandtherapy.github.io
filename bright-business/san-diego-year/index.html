<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>San Diego Club year | Bright Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#42414e; --paper:#fff; --line:rgba(66,65,78,.18); --red:#f00; }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 4.5rem; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Familjen Grotesk", system-ui, sans-serif; }
    .review-bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 3.25rem; padding: 0.7rem 1.5rem;
      background: var(--paper); border-bottom: 1px solid var(--line);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .review-bar a { color: inherit; text-decoration: none; }
    .review-bar a:hover { text-decoration: underline; }
    .review-bar span { color: var(--ink); }
    main { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 80px; }
    .flag { display: inline-block; width: 30px; height: 8px; background: var(--red); margin-right: 14px; vertical-align: middle; }
    h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; margin: 18px 0 12px; }
    .lede { font-size: 22px; line-height: 1.4; max-width: 38rem; margin: 0 0 40px; }
    figure { margin: 0 0 36px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    figcaption span { font-weight: 400; letter-spacing: 0; text-transform: none; }
  </style>
</head>
<body>
  <header class="review-bar" aria-label="Review">
    <a href="https://brandtherapy.florianp.com/bright-business/">Bright Business</a>
    <span>San Diego Club year</span>
    <span>Review</span>
  </header>
  <main>
    <p><span class="flag" aria-hidden="true"></span>Bright Business Club</p>
    <h1>San Diego, the first six months.</h1>
    <p class="lede">Six flyers for the San Diego Club, August through January. Each month keeps its topic, its place, and Diana Barbiani as club lead.</p>
    <figure id="august"><a href="flyers/august.png"><img src="flyers/august.png" alt="August flyer for Balboa Park. Without a system, strategy becomes guesswork."></a><figcaption>August <span>Balboa Park</span></figcaption></figure>
    <figure id="september"><a href="flyers/september.png"><img src="flyers/september.png" alt="September flyer for Torrey Pines. You don't have a delegation problem. You have a process problem."></a><figcaption>September <span>Torrey Pines</span></figcaption></figure>
    <figure id="october"><a href="flyers/october.png"><img src="flyers/october.png" alt="October flyer for the Embarcadero. Purpose gives you wings."></a><figcaption>October <span>Embarcadero</span></figcaption></figure>
    <figure id="november"><a href="flyers/november.png"><img src="flyers/november.png" alt="November flyer for Sunset Cliffs. Your business is shaped by the quality of your decisions."></a><figcaption>November <span>Sunset Cliffs</span></figcaption></figure>
    <figure id="december"><a href="flyers/december.png"><img src="flyers/december.png" alt="December flyer for the Gaslamp Quarter. Stronger together. Greater opportunities."></a><figcaption>December <span>Gaslamp Quarter</span></figcaption></figure>
    <figure id="january"><a href="flyers/january.png"><img src="flyers/january.png" alt="January flyer for Pacific Beach. Solve the right pain for the right people."></a><figcaption>January <span>Pacific Beach</span></figcaption></figure>
  </main>
</body>
</html>
