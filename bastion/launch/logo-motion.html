<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<title>Bastion Companies logo motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One:wght@400&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root { --text:#111D2E; --dark:#111D2E; --dark-surface:#18263A; --light:#ECE7DE; --white:#F6F3EE;
  --accent:#9B2D23; --muted:#5E636A; --muted-readable:#5E636A; --border:#CFCBC3;
  --ff-h:'Fjalla One', Arial Narrow, sans-serif; --ff-b:'Public Sans', Helvetica Neue, Arial, sans-serif;
  --ff-l:'Fjalla One', Arial Narrow, sans-serif; --pad:clamp(28px, 6vw, 112px); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--dark); }
body { font-family: var(--ff-b); color: var(--text); -webkit-font-smoothing: antialiased; }
.deck { height: 100vh; height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; }
.slide { position: relative; min-height: 100vh; min-height: 100dvh; scroll-snap-align: start; display: flex; flex-direction: column;
  justify-content: center; padding: calc(var(--pad) + 28px) var(--pad) var(--pad); background: var(--light); color: var(--text); overflow: hidden; }
.slide.on-dark { background: var(--dark); color: var(--light); }
.s-label { position: absolute; top: var(--pad); left: var(--pad); display: flex; align-items: center; gap: 14px;
  font-family: var(--ff-l); font-size: clamp(10px, 0.82vw, 13px); letter-spacing: 0.315em; text-transform: uppercase; }
.s-label .sq { width: 12px; height: 12px; background: var(--accent); display: block; }
.s-body { width: 100%; max-width: 1500px; margin: 0 auto; }
.big, .huge, .mid { font-family: var(--ff-h); font-weight: 400; text-transform: uppercase; letter-spacing: 0.005em; line-height: 1; text-wrap: balance; }
.big { font-size: clamp(30px, 4.6vw, 84px); line-height: 1.04; max-width: 20em; }
.huge { font-size: clamp(54px, 11.5vw, 220px); line-height: 0.92; }
.mid { font-size: clamp(26px, 3.2vw, 56px); }
.note { font-size: clamp(15px, 1.25vw, 21px); line-height: 1.55; max-width: 34em; color: var(--muted); margin-top: 1.2em; }
.on-dark .note { color: var(--light); opacity: 0.72; }

.opener, .closer { align-items: center; padding: var(--pad); }
.opener .s-body, .closer .s-body { display: flex; justify-content: center; }
.logo-motion { width: min(62vw, 980px); }
.logo-motion img { display: block; width: 100%; height: auto; }
.logo-wordmark { display: block; text-align: center; font-family: var(--ff-h); font-weight: 400; text-transform: uppercase;
  font-size: clamp(40px, 8vw, 150px); line-height: 1; }
.logo-motion { position: relative; }
.logo-motion .lm-accent { position: absolute; inset: 0; transform-origin: var(--cx, 50%) var(--cy, 50%); }
.logo-motion.play .lm-base { opacity: 0; }
.logo-motion.play .lm-accent { opacity: 0; }
.in-view .logo-motion.play .lm-base, .logo-motion.play.run .lm-base {
  animation: logo-reveal 1.3s cubic-bezier(0.65, 0, 0.2, 1) 0.35s forwards; }
.in-view .logo-motion.play.has-accent .lm-base, .logo-motion.play.run.has-accent .lm-base { animation-delay: 0.9s; }
.in-view .logo-motion.play .lm-accent, .logo-motion.play.run .lm-accent {
  animation: logo-accent 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s forwards; }
@keyframes logo-reveal {
  from { opacity: 1; clip-path: inset(0 calc(100% - var(--cx, 0%)) 0 var(--cx, 0%)); }
  to { opacity: 1; clip-path: inset(0 0 0 0); } }
@keyframes logo-accent { from { opacity: 0; transform: scale(0.35); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .logo-motion.play .lm-base, .logo-motion.play .lm-accent { opacity: 1 !important; animation: none !important; }
  .logo-motion.play .lm-base { clip-path: none !important; } }

.star-rows { list-style: none; border-top: 1px solid var(--border); }
.star-rows li { display: grid; grid-template-columns: minmax(120px, 17%) 1fr; gap: 4vw; align-items: baseline; padding: clamp(14px, 2.3vh, 30px) 0; border-bottom: 1px solid var(--border); }
.star-rows span { font-family: var(--ff-l); font-size: clamp(10px, 0.82vw, 13px); letter-spacing: 0.315em; text-transform: uppercase; color: var(--muted); }
.star-rows strong { font-family: var(--ff-h); font-weight: 400; text-transform: uppercase; font-size: clamp(18px, 2.15vw, 38px); line-height: 1.08; text-wrap: balance; }

.personality .s-body { display: grid; gap: clamp(20px, 4vh, 48px); }
.archetype-wheel-layout { display: grid; grid-template-columns: 1fr; gap: clamp(24px, 4vw, 40px); margin: 32px 0 48px; padding: clamp(24px, 4vw, 40px); border: 1px solid var(--border); background: var(--white); }
.archetype-wheel { display: block; width: 100%; max-width: 620px; height: auto; margin: 0 auto; overflow: visible; }
.aw-sector { fill: var(--white); stroke: var(--border); stroke-width: 1.5; }
.aw-sector.primary { fill: var(--accent); stroke: var(--white); }
.aw-sector.balancing { fill: var(--text); stroke: var(--white); }
.aw-label { font-family: var(--ff-b); font-size: 15px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--muted-readable); }
.aw-label.primary, .aw-label.balancing { fill: var(--text); font-weight: 800; }
.aw-center { font-family: var(--ff-h); font-size: 34px; font-weight: 800; letter-spacing: -0.01em; fill: var(--text); }
.archetype-wheel-read { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 32px; }
.archetype-wheel-read li { display: grid; gap: 6px; padding: 22px 0 22px 20px; border-top: 1px solid var(--border); border-left: 6px solid var(--text); }
.archetype-wheel-read li.primary { border-left-color: var(--accent); }
.archetype-wheel-read li { border-bottom: 1px solid var(--border); }
.archetype-wheel-read strong { font-family: var(--ff-h); font-size: 28px; font-weight: 800; letter-spacing: -0.01em; color: var(--text); line-height: 1.05; }
.aw-role { font-family: var(--ff-b); font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted-readable); }
.aw-promise { font-family: var(--ff-b); font-size: 15px; color: var(--text); }
.aw-essence { font-family: var(--ff-b); font-size: 14px; line-height: 1.6; color: var(--muted); }
.personality .archetype-wheel-layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); align-items: center; border: 0; margin: 0; padding: 0; background: none; gap: 5vw; }
.personality .archetype-wheel { max-width: min(100%, 62vh); }
.personality .archetype-wheel-read { grid-template-columns: 1fr; }
.personality .archetype-wheel-read strong, .personality .aw-center { font-weight: 400; text-transform: uppercase; }
.personality .aw-sector { fill: var(--light); }
.personality .aw-sector.primary { fill: var(--accent); stroke: var(--light); }
.personality .aw-sector.balancing { fill: var(--text); stroke: var(--light); }

.slider-rows { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(18px, 5.4vh, 60px) 7vw; }
.slider-rows li { display: grid; grid-template-columns: 8em 1fr 8em; gap: 20px; align-items: center;
  font-family: var(--ff-l); font-size: clamp(11px, 1.08vw, 18px); letter-spacing: 0.18em; text-transform: uppercase; }
.slider-rows .r { text-align: right; }
.slider-rows .track { position: relative; height: 1px; background: var(--text); opacity: 1; }
.slider-rows .track i { position: absolute; top: 50%; width: 16px; height: 16px; background: var(--text); transform: translate(-50%, -50%); }

.bleed { padding: 0; }
.bleed .s-body { max-width: none; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
.bleed img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.bleed .s-label { display: none; }

.tiles { display: grid; gap: clamp(12px, 1.6vw, 28px); }
.tiles.n2 { grid-template-columns: 1fr 1fr; } .tiles.n3 { grid-template-columns: 1.25fr 1.25fr 0.8fr; }
.tile { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; padding: 9%; background: var(--white); border: 1px solid var(--border); }
.tiles.n3 .tile { aspect-ratio: auto; height: clamp(220px, 46vh, 520px); }
.tile.dark { background: var(--dark); border-color: var(--dark); }
.tile img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

.signature .s-body { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr); gap: 7vw; align-items: center; }
.signature figure img { display: block; width: auto; max-width: 100%; max-height: 68vh; margin-left: calc(-1 * var(--pad)); }

.app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 1.4vw, 24px); }
.app-grid figure { height: clamp(150px, 33vh, 380px); display: flex; align-items: center; justify-content: center; background: var(--border); padding: clamp(10px, 1.6vw, 26px); }
.app-grid img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.14); }

.system .s-body { display: grid; gap: clamp(28px, 6vh, 72px); }
.chips { list-style: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; }
.chips li { display: grid; gap: 8px; }
.chips i { display: block; height: clamp(90px, 22vh, 240px); border: 1px solid var(--border); border-left-width: 0; margin-bottom: 8px; }
.chips li:first-child i { border-left-width: 1px; }
.chips strong { font-family: var(--ff-l); font-weight: 400; font-size: clamp(10px, 0.82vw, 13px); letter-spacing: 0.18em; text-transform: uppercase; }
.chips span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.type .fonts { margin-top: 1.6em; font-family: var(--ff-l); font-size: clamp(10px, 0.82vw, 13px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.type .fonts b { display: inline-block; width: 28px; height: 1px; background: var(--muted); vertical-align: middle; margin: 0 14px; }

.count { position: fixed; right: var(--pad); bottom: calc(var(--pad) * 0.45); font-family: var(--ff-l); font-size: 11px; letter-spacing: 0.2em;
  color: #fff; mix-blend-mode: difference; opacity: 0.6; z-index: 5; font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {
  .slider-rows, .signature .s-body, .personality .archetype-wheel-layout, .tiles.n2, .tiles.n3 { grid-template-columns: 1fr; }
  .app-grid { grid-template-columns: 1fr 1fr; } .chips { grid-auto-flow: row; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chips i { border-left-width: 1px; height: 90px; } .star-rows li { grid-template-columns: 1fr; gap: 6px; }
  .signature figure img { margin-left: 0; max-height: 40vh; } .tiles.n3 .tile { height: 30vh; }
  .slide { justify-content: flex-start; padding-top: calc(var(--pad) + 64px); } .opener, .closer { justify-content: center; }
  .logo-motion { width: 82vw; }
}
@media print { .deck { height: auto; overflow: visible; } .slide { break-after: page; } .count { display: none; } }
body{display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}body.on-dark{background:var(--dark)}body.on-light{background:var(--light)}.stage{display:none}.on-dark .stage.dark,.on-light .stage.light{display:block}</style>
</head>
<body class="on-dark">
<div class="stage dark"><div class="logo-motion play has-accent" style="--cx:26.78%;--cy:50.00%"><img class="lm-base" src="../images/identity/logo/bastion-logo-reversed-transparent.png" alt="Bastion Companies logo"><img class="lm-accent" src="../images/identity/logo/bastion-logo-reversed-transparent.png" alt="" aria-hidden="true" style="clip-path:inset(40.94% 70.44% 40.94% 24.00%)"></div></div>
<div class="stage light"><div class="logo-motion play has-accent" style="--cx:26.78%;--cy:50.00%"><img class="lm-base" src="../images/identity/logo/bastion-logo-primary-transparent.png" alt="Bastion Companies logo"><img class="lm-accent" src="../images/identity/logo/bastion-logo-primary-transparent.png" alt="" aria-hidden="true" style="clip-path:inset(40.94% 70.44% 40.94% 24.00%)"></div></div>
<script>(function(){var q=new URLSearchParams(location.search);var bg=q.get('bg')==='light'?'light':'dark';document.body.className='on-'+bg;var el=document.querySelector('.stage.'+bg+' .logo-motion');function play(){el.classList.remove('run');void el.offsetWidth;el.classList.add('run');}play();if(q.get('loop')!=='0')setInterval(play,4100);})();</script>
</body>
</html>
