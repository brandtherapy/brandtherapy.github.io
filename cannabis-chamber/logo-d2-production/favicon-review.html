<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCC Favicon</title>
<link rel="icon" href="png/ccc-favicon.ico">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0ede6; color: #1C2420; padding: 48px 40px; max-width: 900px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #999; margin-bottom: 14px; }
  .panels { display: flex; gap: 24px; margin-bottom: 48px; }
  .panel { background: #f0ede6; border-radius: 10px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 1; }
  .panel .art { display: flex; align-items: flex-end; justify-content: center; gap: 20px; min-height: 160px; }
  .cap { font-size: 13px; color: #666; text-align: center; line-height: 1.4; }
  hr { border: none; border-top: 1px solid #d5d0c8; margin: 0 0 48px; }

  /* Browser context */
  .browser { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.1); margin-bottom: 48px; }
  .chrome { background: #e0ddd6; padding: 10px 12px 0; display: flex; align-items: flex-end; gap: 4px; }
  .tab { background: #f8f6f1; border-radius: 8px 8px 0 0; padding: 8px 16px 8px 10px; font-size: 12px; color: #333; display: flex; align-items: center; gap: 7px; max-width: 240px; white-space: nowrap; overflow: hidden; }
  .tab img { width: 16px; height: 16px; flex-shrink: 0; }
  .urlbar-row { background: #e8e5de; padding: 8px 12px; }
  .urlbar { background: #fff; border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #555; display: inline-flex; align-items: center; gap: 8px; max-width: 400px; }
  .urlbar img { width: 16px; height: 16px; }
  .page-body { background: #fff; padding: 24px; height: 60px; }
</style>
</head>
<body>

<div class="label">Favicon — master mark tiers (approved)</div>
<div class="panels">
  <div class="panel">
    <div class="art" style="align-items:center">
      <img src="png/ccc-mark-48.png" style="width:55%">
    </div>
    <div class="cap">Master mark at 48px</div>
  </div>
  <div class="panel">
    <div class="art">
      <img src="png/ccc-mark-64.png" style="image-rendering:pixelated; width:192px">
      <img src="png/ccc-mark-48.png" style="image-rendering:pixelated; width:144px">
      <img src="png/ccc-mark-32.png" style="image-rendering:pixelated; width:96px">
    </div>
    <div class="cap">Favicon tiers 64 / 48 / 32, shown at 3&times; (approved; no 16px tier)</div>
  </div>
</div>

<hr>

<div class="label">In context</div>
<div class="browser">
  <div class="chrome">
    <div class="tab">
      <img src="png/ccc-favicon.ico" alt="favicon">
      Cannabis Chamber of Commerce
    </div>
  </div>
  <div class="urlbar-row">
    <div class="urlbar">
      <img src="png/ccc-favicon.ico" alt="favicon">
      cannabischamber.org
    </div>
  </div>
  <div class="page-body"></div>
</div>

</body>
</html>
