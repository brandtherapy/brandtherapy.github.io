<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-C mark, motion</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  a { display: block; width: 100%; height: 100%; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Animated Three-C mark: "Rewind into Thread". Self-contained, no libraries.
  The mark rests on the locked logo. Every 30 s the three C lines draw into the
  brass dot while the mark turns counterclockwise, the dot bounces once with a
  glint, and the lines draw back out with no rotation.
  Options (query string): every=<seconds> (default 30), first=<seconds> (default 3),
  href=<url> (makes the mark a link, opened in the top window).
  prefers-reduced-motion shows the still mark.
-->
<a id="link" aria-label="Cannabis Chamber of Commerce, home"><svg id="mark" viewBox="0 0 1000 1000" role="img" aria-label="Cannabis Chamber of Commerce logo"></svg></a>
<script>
(function () {
  var W = 95.49, A = 250, R = 202.255;
  var COLORS = ["#2D432B", "#2A5D5B", "#D06E53"];
  var NS = "http://www.w3.org/2000/svg";
  var q = new URLSearchParams(location.search);
  var EVERY = Math.max(4, +q.get("every") || 30), FIRST = q.has("first") ? +q.get("first") : 3;
  var link = document.getElementById("link"), href = q.get("href");
  if (href && /^https:\/\//.test(href)) { link.href = href; link.target = "_top"; } else link.removeAttribute("aria-label");

  function pt(r, deg) { var a = deg * Math.PI / 180; return [500 + r * Math.cos(a), 291.7 + r * Math.sin(a)]; }
  // One circle around the forest C's arc center, starting inside the dot clearance (95 deg).
  // pathLength 360 makes dash units degrees; the locked C runs from 0 to 250.
  var p0 = pt(R, 95), p1 = pt(R, 275);
  var RING = "M " + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + " A " + R + " " + R + " 0 1 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) +
             " A " + R + " " + R + " 0 1 1 " + p0[0].toFixed(2) + " " + p0[1].toFixed(2);
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  var svg = document.getElementById("mark");
  var defs = el("defs", {}, svg);
  var mask = el("mask", { id: "clr", maskUnits: "userSpaceOnUse", x: -1000, y: -1000, width: 3000, height: 3000 }, defs);
  el("rect", { x: -1000, y: -1000, width: 3000, height: 3000, fill: "#fff" }, mask);
  el("circle", { cx: 500, cy: 500, r: 88, fill: "#000" }, mask);
  var shine = el("linearGradient", { id: "shine" }, defs);
  [[0, 0], [0.5, 0.85], [1, 0]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": "#FFF6DF", "stop-opacity": s[1] }, shine); });
  var clip = el("clipPath", { id: "face" }, defs);
  var clipDot = el("circle", { cx: 500, cy: 500, r: 61 }, clip);

  var root = el("g", {}, svg);
  var cs = el("g", { mask: "url(#clr)" }, root);
  var arcs = COLORS.map(function (c, i) {
    return el("path", { d: RING, pathLength: 360, fill: "none", stroke: c, "stroke-width": W, "stroke-linecap": "butt", transform: "rotate(" + i * 120 + " 500 500)" }, cs);
  });
  var dot = el("circle", { cx: 500, cy: 500, r: 61, fill: "#9C7C46" }, root);
  var glint = el("rect", { x: -26, y: -120, width: 52, height: 240, fill: "url(#shine)" }, el("g", { "clip-path": "url(#face)", "pointer-events": "none" }, svg));

  // Eases match GSAP power2 (cubic) and back.out(2.6).
  function clamp(p) { return p < 0 ? 0 : p > 1 ? 1 : p; }
  function cin(p) { return p * p * p; }
  function cout(p) { return 1 - Math.pow(1 - p, 3); }
  function cinout(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function backOut(p) { var s = 2.6; p -= 1; return 1 + (s + 1) * p * p * p + s * p * p; }
  function seg(t, start, dur) { return clamp((t - start) / dur); }

  var DUR = 1.8;
  // The whole loop as a function of time. t = DUR is the locked logo.
  function state(t) {
    var rot = t < 0.74 ? -200 * cin(seg(t, 0, 0.7)) : 0;
    var a1 = [0, 1, 2].map(function (i) {
      return t < 0.8 ? A * (1 - cin(seg(t, 0.03 + 0.05 * i, 0.6))) : A * cout(seg(t, 0.8, 0.5));
    });
    var d = t < 0.86 ? 1 + 0.14 * cout(seg(t, 0.7, 0.16)) : 1.14 - 0.14 * backOut(seg(t, 0.86, 0.45));
    var g = t < 0.9 || t > 1.4 ? 0 : cinout(seg(t, 0.9, 0.5));
    return { rot: rot, a1: a1, dot: d, glint: g };
  }
  function render(t) {
    var s = state(t), r = 61 * s.dot;
    root.setAttribute("transform", "rotate(" + s.rot.toFixed(3) + " 500 500)");
    dot.setAttribute("r", r.toFixed(3));
    clipDot.setAttribute("r", r.toFixed(3));
    glint.setAttribute("transform", "translate(" + (500 + (s.glint * 2 - 1) * r * 1.6).toFixed(2) + " 500) rotate(28)");
    glint.style.visibility = s.glint > 0 && s.glint < 1 ? "visible" : "hidden";
    arcs.forEach(function (p, i) {
      var len = Math.max(0, Math.min(360, s.a1[i]));
      p.style.visibility = len > 0.01 ? "visible" : "hidden";
      p.setAttribute("stroke-dasharray", len.toFixed(3) + " " + (360 - len).toFixed(3));
    });
  }
  render(DUR);
  window.cccMarkAt = render;

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var running = false;
  function play() {
    if (running || document.hidden) return;
    running = true;
    var t0 = null;
    requestAnimationFrame(function step(now) {
      if (t0 === null) t0 = now;
      var t = (now - t0) / 1000;
      render(Math.min(t, DUR));
      if (t < DUR) requestAnimationFrame(step); else running = false;
    });
  }
  window.cccMarkPlay = play;
  setTimeout(function () { play(); setInterval(play, EVERY * 1000); }, FIRST * 1000);
})();
</script>
</body>
</html>
