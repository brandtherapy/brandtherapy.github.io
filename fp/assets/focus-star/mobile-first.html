<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Focus Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --acc: #5A5CF9;
    --acc-soft: rgba(90,92,249,.07);
    --border: #E5E7EB;
    --muted: #66667E;
    --ink: #1A1A2E;
    --ff-h: 'Bricolage Grotesque', system-ui, sans-serif;
    --ff-b: 'Poppins', system-ui, sans-serif;
    --ease: cubic-bezier(.16,1,.3,1);
    --bg: #FFFFFF;
    --bg-dial: #FFFFFF;
  }
  * { box-sizing: border-box; }

  /* ============================================================
     MOBILE-FIRST BASE
     The base (no media query) styles are the phone single-column
     layout. One native scroll context, normal document flow.
     The desktop two-pane layout lives in @media (min-width:980px).
     ============================================================ */

  html, body {
    margin: 0; padding: 0; width: 100%;
    background: var(--bg);
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--ff-b); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: none;
  }

  /* The stage is a plain single column in the mobile base. */
  .stage {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    padding-bottom: calc(56px + env(safe-area-inset-bottom) + 40px);
  }
  .stage::after { display: none; }

  /* ---- DIAL BAND (hero + working instrument) ---- */
  .dial-wrap {
    order: -1;
    position: relative;
    width: 100%;
    height: clamp(260px, 44svh, 320px);
    flex: 0 0 auto;
    background: var(--bg-dial);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }
  .dial-wrap.dragging { cursor: grabbing; }
  .dial-wrap > svg {
    position: absolute; inset: 3%;
    width: 94%; height: 94%;
    display: block;
  }
  .dial-wrap.wobble > svg { animation: dialWobble 1.2s var(--ease); }
  @keyframes dialWobble {
    0%   { transform: rotate(0deg); }
    34%  { transform: rotate(6deg); }
    100% { transform: rotate(0deg); }
  }

  /* Fixed DOM indicator notch (caret + short stem) at top-center
     of the band. Stays put while the rotor spins. */
  .dial-notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    line-height: 0;
  }
  .dial-notch svg { display: block; }
  .dial-notch .ix-stem { stroke: var(--acc); stroke-width: 2; }
  .dial-notch .ix-tip { fill: var(--acc); }

  /* ---- in-reader desktop chrome hidden on mobile ---- */
  .mode-bar { display: none; }
  .navigation-panel { display: none; }
  .case-logo { display: none; }

  /* ---- READER (single column) ---- */
  .reader {
    position: relative;
    z-index: 2;
    width: 100%;
    min-width: 0;
    background: var(--bg);
    display: block;
  }
  .reader-fit { width: 100%; }
  .detail-fit {
    width: 100%;
    transform: none;
  }

  /* ---- META STRIP ---- */
  .meta-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    min-height: 38px;
  }
  .meta-eyebrow {
    font-family: var(--ff-h);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--acc);
    line-height: 1;
  }
  .meta-count {
    font-family: var(--ff-b);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1;
    white-space: nowrap;
  }

  /* one-time fading discoverability caption under the meta strip */
  .drag-hint {
    padding: 8px 18px 0;
    font-family: var(--ff-b);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--muted);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s var(--ease);
  }
  .drag-hint.show { opacity: 1; }

  /* ---- TITLE ---- */
  .hero {
    min-width: 0;
    display: block;
    padding: 18px 18px 0;
    scroll-margin-top: 14px;
  }
  .pillar-eyebrow { display: none; }
  .pillar-title {
    font-family: var(--ff-h); font-weight: 800;
    font-size: clamp(42px, 12vw, 58px);
    line-height: .92; letter-spacing: -.03em;
    text-transform: uppercase; color: var(--ink);
    margin: 0;
  }
  .pillar-title .dot { color: var(--acc); }

  /* reader body text column */
  #detail-fit {
    padding: 18px 18px 0;
  }

  .pillar-desc {
    font-family: var(--ff-b); font-weight: 400;
    font-size: 15px;
    line-height: 1.72;
    color: #39394C;
    margin: 0 0 24px;
    max-width: 720px;
  }
  .pillar-desc strong { font-weight: 600; color: var(--ink); }

  /* hero image (renderer only sets it when a pillar has p.image) */
  .pillar-hero-image { position: relative; margin: 0 0 22px; display: none; }
  .pillar-hero-image.visible { display: block; }
  .pillar-hero-image img {
    display: block; width: 100%;
    height: clamp(170px, 30vw, 260px);
    object-fit: cover; background: #F0F0F5;
  }
  .pillar-hero-image::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 28px; height: 10px;
    border-top: 3px solid var(--acc); border-left: 3px solid var(--acc); z-index: 1;
  }
  .pillar-hero-image::after {
    content: ''; position: absolute; bottom: 0; right: 0;
    width: 28px; height: 10px;
    border-bottom: 3px solid var(--acc); border-right: 3px solid var(--acc); z-index: 1;
  }

  /* ---- CASE: focus block (single column) ---- */
  .case-focus-block {
    display: none;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
    margin-bottom: 18px;
  }
  .case-focus-block.visible {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-items: start;
  }
  .case-focus-label {
    font-family: var(--ff-b);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .22em;
    line-height: 1.35;
    text-transform: uppercase;
    color: var(--acc);
  }
  .case-focus-copy { min-width: 0; display: grid; gap: 10px; }
  .case-focus-headline {
    font-family: var(--ff-h);
    font-size: clamp(26px, 7.4vw, 36px);
    font-weight: 800;
    letter-spacing: -.018em;
    line-height: 1.04;
    color: var(--ink);
  }
  .case-focus-support {
    font-family: var(--ff-b);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--acc);
  }
  .case-focus-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .case-focus-chips:empty { display: none; }
  .case-focus-chips span {
    border: 1px solid var(--border);
    padding: 5px 8px;
    font-family: var(--ff-b);
    font-size: 10px; line-height: 1;
    color: var(--muted); background: var(--bg);
  }

  /* ---- CASE: persona block (single column) ---- */
  .persona-block { display: none; margin-bottom: 20px; }
  .persona-block.visible {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    align-items: start;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .persona-image {
    width: 100%;
    max-width: 240px;
    aspect-ratio: 3 / 4;
    background: #F7F7FA; border: 1px solid var(--border);
    border-radius: 0;
    overflow: hidden; position: relative;
    display: block;
  }
  .persona-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .persona-silhouette { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .persona-silhouette svg { width: 68px; height: auto; }
  .persona-img-label { display: none; }
  .persona-info { display: grid; gap: 10px; min-width: 0; }
  .persona-role {
    font-family: var(--ff-h); font-weight: 700;
    font-size: clamp(16px, 4.6vw, 20px);
    text-transform: uppercase; letter-spacing: .04em; color: var(--ink);
    line-height: 1.2; margin: 0;
  }
  .persona-context {
    font-family: var(--ff-h);
    font-size: clamp(22px, 6.6vw, 30px);
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -.015em;
    color: var(--ink);
    margin: 0;
  }
  .persona-need {
    font-family: var(--ff-b);
    font-size: 14px; font-weight: 600;
    color: var(--acc); line-height: 1.45;
    border-top: 1px solid var(--border); padding-top: 10px;
    margin: 0;
  }
  .persona-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .persona-tags span {
    border: 1px solid var(--border);
    padding: 4px 7px;
    font-family: var(--ff-b);
    font-size: 10px; line-height: 1;
    color: var(--muted); background: var(--bg);
  }

  /* ---- CASE: archetype block (single column) ---- */
  .archetype-block { display: none; margin-bottom: 20px; }
  .archetype-block.visible {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    align-items: start;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .archetype-icons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    max-width: 240px;
  }
  .archetype-img {
    aspect-ratio: 1;
    background: #F7F7FA; border: 1px solid var(--border); border-radius: 0;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .archetype-img img { width: 88%; height: 88%; object-fit: contain; display: block; }
  .archetype-img .arch-icon { font-size: 24px; line-height: 1; color: var(--acc); }
  .arch-name {
    font-family: var(--ff-h); font-weight: 800;
    font-size: clamp(26px, 7vw, 38px);
    text-transform: uppercase; letter-spacing: -.01em; color: var(--ink);
    line-height: .94; margin: 0 0 6px;
  }
  .arch-type {
    font-family: var(--ff-b); font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--acc); margin-bottom: 10px;
  }
  .arch-traits { display: grid; gap: 6px; }
  .arch-tag {
    font-family: var(--ff-b); font-size: 12px; font-weight: 500;
    color: var(--muted); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: 0; line-height: 1.25;
  }

  /* ---- CASE: insight grid (forced 1 column) ---- */
  .insight-grid {
    display: none;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .insight-grid.visible { display: grid; }
  .insight-card {
    min-width: 0;
    border: 1px solid var(--border);
    background: #FAFAFC;
    padding: 14px 16px 16px;
  }
  .insight-card .label {
    font-family: var(--ff-b); font-size: 9px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--acc);
    margin-bottom: 8px;
  }
  .insight-card p {
    margin: 0;
    font-family: var(--ff-b);
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
  }
  .case-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .case-list li {
    position: relative;
    padding-left: 14px;
    font-family: var(--ff-b);
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
  }
  .case-list li::before {
    content: '';
    position: absolute;
    left: 0; top: .6em;
    width: 5px; height: 5px;
    background: var(--acc);
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag-row span {
    border: 1px solid var(--border);
    padding: 3px 6px;
    font-family: var(--ff-b);
    font-size: 9px; line-height: 1;
    color: var(--muted);
  }

  /* ---- CASE: moodboard (forced 2 columns) ---- */
  .moodboard-block {
    display: none;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .moodboard-block.visible { display: grid; }
  .moodboard-item {
    aspect-ratio: 1.3;
    border: 1px solid var(--border);
    overflow: hidden;
    background: #F7F7FA;
  }
  .moodboard-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---- CASE: apply block (purple top rule, not left border) ---- */
  .apply-block {
    display: none;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-bottom: 20px;
  }
  .apply-block.visible { display: block; }
  .stage[data-mode="case"] .apply-block.visible {
    border-top: 2px solid var(--acc);
    padding-top: 14px;
  }
  .apply-label {
    font-family: var(--ff-b); font-size: 9px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--acc); margin-bottom: 6px;
  }
  .apply-text {
    font-family: var(--ff-b); font-size: 14px; line-height: 1.62;
    color: var(--ink); font-weight: 400;
  }

  /* ---- GUIDE: impacts ("What it shapes") ---- */
  .impacts-block { border-top: 1px solid var(--border); margin-bottom: 12px; }
  .stage[data-mode="case"] .impacts-block { display: none; }
  .impacts-head {
    font-family: var(--ff-b); font-size: 9px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    padding: 12px 0 8px;
  }
  .impacts {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .impacts li {
    display: flex; align-items: center;
    padding: 8px 10px 8px 0; border-top: 1px solid var(--border);
    font-family: var(--ff-b); font-weight: 500;
    font-size: 13px; color: var(--ink);
  }
  .impacts li:nth-child(even) { padding-left: 12px; border-left: 1px solid var(--border); }
  .impacts li::before { content: '-'; color: var(--acc); margin-right: 7px; font-size: 9px; }

  /* ---- SVG rotor / star / ring / center (unchanged styling) ---- */
  .indicator { display: none; }
  .star-arm { transition: fill .6s var(--ease); }
  .star-arm.active { fill: var(--acc); }
  .star-hit { fill: transparent; cursor: pointer; }
  .star-outline { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .ring-tick { stroke: rgba(80,80,100,.32); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ring-tick.major { stroke: rgba(50,50,70,.6); }
  .ring-tick.pillar { stroke: rgba(26,26,46,.55); stroke-width: 1.4; }
  .ring-tick.pillar.active { stroke: var(--acc); stroke-width: 2; }
  .pillar-text {
    font-family: var(--ff-h); font-weight: 700;
    font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
    fill: rgba(136,136,160,.6);
    transition: fill .6s var(--ease), font-size .5s var(--ease);
  }
  .pillar-text.active { fill: var(--ink); }
  .pillar-hit { fill: transparent; cursor: pointer; }
  .center-cap { fill: var(--bg); stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .center-spoke { stroke: var(--acc); stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; }

  /* ============================================================
     FIXED THUMB BAR (mobile only; hidden on desktop)
     ============================================================ */
  .thumb-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: stretch;
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 56px;
  }
  .thumb-progress {
    position: absolute;
    top: 0; left: 0;
    height: 2px;
    width: 20%;
    background: var(--acc);
    transition: width .35s var(--ease);
    z-index: 1;
  }
  .thumb-toggle {
    display: flex;
    flex: 0 0 auto;
    border-right: 1px solid var(--border);
  }
  .thumb-toggle .mode-btn {
    font-family: var(--ff-b);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    min-height: 44px;
    padding: 8px 14px;
    color: var(--muted);
    background: transparent;
    line-height: 1;
    white-space: nowrap;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .thumb-toggle .mode-btn + .mode-btn { border-left: 1px solid var(--border); }
  .thumb-toggle .mode-btn.active {
    color: var(--ink);
    background: var(--acc-soft);
    box-shadow: inset 0 -2px 0 var(--acc);
  }
  .thumb-pager {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
  }
  .pager-cell {
    flex: 1 1 0;
    min-width: 44px;
    min-height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-left: 1px solid var(--border);
    border-radius: 0;
    cursor: pointer;
    background: transparent;
    font-family: var(--ff-b);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    line-height: 1;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .pager-cell:first-child { border-left: 0; }
  .pager-cell.active {
    color: var(--ink);
    background: var(--acc-soft);
    box-shadow: inset 0 -2px 0 var(--acc);
  }

  /* ============================================================
     DESKTOP (>= 980px): the original elegant two-pane layout,
     preserved unchanged. Mobile chrome (thumb bar, meta strip,
     dial band, title) is overridden back to the desktop design.
     ============================================================ */
  @media (min-width: 980px) {
    html, body { height: 100%; overflow: hidden; }
    body { overscroll-behavior: none; }

    .thumb-bar { display: none; }
    .meta-strip { display: none; }
    .drag-hint { display: none; }

    .stage {
      position: relative; width: 100%; height: 100vh; height: 100svh;
      display: grid;
      grid-template-columns: minmax(620px, 60%) 1fr;
      align-items: start;
      overflow: hidden;
      padding-bottom: 0;
      min-height: 0;
    }
    .stage::after {
      content: ''; display: block; position: absolute;
      top: 0; bottom: 0; left: 60%;
      width: 1px; background: var(--border);
      pointer-events: none; z-index: 3;
      opacity: var(--divider-opacity, 0);
      transition: opacity .5s;
    }

    .reader {
      position: relative; z-index: 2;
      min-width: 0;
      padding: clamp(38px,4vw,64px) clamp(40px,3.6vw,68px) clamp(32px,3.2vw,52px) clamp(48px,4.5vw,86px);
      display: flex; flex-direction: column;
      background: var(--bg);
      height: 100%;
      overflow: hidden;
      overscroll-behavior: contain;
    }
    .reader-fit { width: 100%; }
    .detail-fit {
      width: 100%;
      transform-origin: top left;
      will-change: transform;
    }

    .stage[data-mode="case"] {
      grid-template-columns: minmax(700px, 62%) 1fr;
    }
    .stage[data-mode="case"] .reader {
      padding-top: clamp(34px,3.4vw,54px);
      padding-bottom: clamp(28px,2.8vw,44px);
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .stage[data-mode="case"] .detail-fit {
      transform: none !important;
      width: 100% !important;
    }
    .stage[data-mode="case"] .navigation-panel {
      margin-bottom: clamp(22px,2.4vw,34px);
    }

    .mode-bar {
      display: flex; align-items: center; gap: 16px;
      min-height: 42px;
      margin-bottom: 14px;
    }
    /* keep the case-study label first (brand-name primary tab) */
    #btn-case { order: 0; }
    #btn-guide { order: 1; }

    .case-logo {
      display: none;
    }

    .mode-toggle {
      display: flex;
      background: #F0F0F5;
      border-radius: 0; padding: 4px; gap: 2px;
    }
    .mode-btn {
      font-family: var(--ff-b); font-size: 11px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase;
      border: none; cursor: pointer;
      padding: 7px 18px; border-radius: 0;
      color: var(--muted);
      transition: color .2s var(--ease), background .2s var(--ease), box-shadow .2s;
      line-height: 1; white-space: nowrap;
      background: transparent;
    }
    .mode-btn.active {
      background: var(--bg);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    .navigation-panel {
      min-width: 0;
      display: grid;
      gap: 14px;
      margin-bottom: clamp(26px,3.4vw,44px);
    }
    .pillar-nav {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .pillar-link {
      min-width: 0;
      display: grid;
      gap: 6px;
      padding: 11px 10px 12px;
      border-right: 1px solid var(--border);

<script>

const CONFIG_PATH = './config.json';
let SOURCE_DATA = null;
let BRAND = { name: 'Brand', shortName: 'Brand' };
let PILLARS = [];

function normalizePanel(panel={}){
  return {
    desc: panel.desc || '',
    apply: panel.apply || '',
    impacts: Array.isArray(panel.impacts) ? panel.impacts : [],
    focus: panel.focus || null,
    cards: Array.isArray(panel.cards) ? panel.cards : [],
    persona: panel.persona || null,
    archetype: panel.archetype || null,
    archetypeAssets: panel.archetypeAssets || null,
    moodboard: Array.isArray(panel.moodboard) ? panel.moodboard : [],
    details: panel.details || null
  };
}

function escapeHTML(value=''){
  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function truncate(value='', max=150){
  const clean = String(value).trim();
  return clean.length > max ? `${clean.slice(0, max - 1).trim()}...` : clean;
}

function renderCaseCard(card={}){
  const label = card.label || 'Detail';
  const items = Array.isArray(card.items) ? card.items.filter(Boolean).slice(0,3) : [];
  const body = items.length
    ? `<ul class="case-list">${items.map(item=>`<li>${escapeHTML(truncate(item, 190))}</li>`).join('')}</ul>`
    : `<p>${escapeHTML(truncate(card.value || '', 260))}</p>`;
  return `
    <article class="insight-card" data-tone="${escapeHTML(card.tone || '')}">
      <div class="label">${escapeHTML(label)}</div>
      ${body}
    </article>
  `;
}

function resolveAssetPath(path=''){
  const value = String(path);
  return value.startsWith('assets/') ? `../${value.slice('assets/'.length)}` : value;
}

function normalizeConfig(config){
  if(!config || !Array.isArray(config.pillars) || !config.pillars.length){
    throw new Error('config.json is missing pillars');
  }
  return {
    ...config,
    brand: config.brand || {},
    visual: config.visual || {},
    pillars: config.pillars.map((pillar,index)=>({
      ...pillar,
      id: pillar.id || `p${index+1}`,
      title: pillar.title || `P${index+1}`,
      eyebrow: pillar.eyebrow || '',
      guide: normalizePanel(pillar.guide),
      case: normalizePanel(pillar.case)
    }))
  };
}

function applyTheme(config){
  const root = document.documentElement;
  const brand = config.brand || {};
  const visual = config.visual || {};
  if(brand.accentColor) root.style.setProperty('--acc', brand.accentColor);
  if(brand.inkColor) root.style.setProperty('--ink', brand.inkColor);
  if(visual.background) root.style.setProperty('--bg', visual.background);
  if(visual.dialBackground) root.style.setProperty('--bg-dial', visual.dialBackground);
  document.getElementById('case-brand-name').textContent = brand.name || brand.shortName || 'Brand';
  const _btnCase = document.getElementById('btn-case');
  if(_btnCase) _btnCase.textContent = brand.name || brand.shortName || 'Case Study';
  document.title = `${brand.shortName || brand.name || 'Brand'} Focus Star`;
}


const STEP = 72;
const STAR_R = 278, STAR_INNER = STAR_R * 0.38;
const RING_INNER = 338, RING_TICK_R = 360, PILLAR_TEXT_R = 480;


let mode = 'case';
let activeIdx = 0;
let rotation = 0, target = 0;
let dragging = false, lastPointerAng = 0, dragVelocity = 0, lastDragTime = 0;
let wheelAccum = 0; // for scroll resistance

const stage      = document.getElementById('stage');
const dialWrap   = document.getElementById('dialWrap');
const rotor      = document.getElementById('rotor');
const fineTicks  = document.getElementById('fineTicks');
const pillarRing = document.getElementById('pillarRing');
const starGroup  = document.getElementById('starGroup');
const reader     = document.querySelector('.reader');
const readerFit  = document.getElementById('reader-fit');
const detailFit  = document.getElementById('detail-fit');
const pillarNav  = document.getElementById('pillar-nav');

function buildSectionNav(){
  pillarNav.innerHTML = PILLARS.map((p,i)=>`
    <a class="pillar-link${i===activeIdx?' active':''}" href="#${p.id}" data-pidx="${i}">
      <span class="nav-index">${String(i+1).padStart(2,'0')}</span>
      <span class="nav-label">${p.title}</span>
    </a>
  `).join('');
  pillarNav.querySelectorAll('.pillar-link').forEach(link=>{
    link.addEventListener('click',event=>{
      event.preventDefault();
      goToIndex(+link.dataset.pidx);
    });
  });
}


function buildFineTicks(){
  fineTicks.innerHTML = '';
  const f=document.createDocumentFragment();
  for(let a=0;a<360;a+=6){
    const major=(a%18===0);
    const rad=(a-90)*Math.PI/180;
    const x1=Math.cos(rad)*RING_INNER, y1=Math.sin(rad)*RING_INNER;
    const r2=major?RING_TICK_R:RING_INNER+8;
    const x2=Math.cos(rad)*r2, y2=Math.sin(rad)*r2;
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1.toFixed(2)); ln.setAttribute('y1',y1.toFixed(2));
    ln.setAttribute('x2',x2.toFixed(2)); ln.setAttribute('y2',y2.toFixed(2));
    ln.setAttribute('class','ring-tick'+(major?' major':''));
    f.appendChild(ln);
  }
  fineTicks.appendChild(f);
}

function buildPillarRing(){
  pillarRing.innerHTML = '';
  const f=document.createDocumentFragment();
  PILLARS.forEach((p,i)=>{
    const ang=i*STEP, rad=(ang-90)*Math.PI/180;
    const x1=Math.cos(rad)*(RING_TICK_R+4), y1=Math.sin(rad)*(RING_TICK_R+4);
    const x2=Math.cos(rad)*(RING_TICK_R+24), y2=Math.sin(rad)*(RING_TICK_R+24);
    const tk=document.createElementNS('http://www.w3.org/2000/svg','line');
    tk.setAttribute('x1',x1.toFixed(2)); tk.setAttribute('y1',y1.toFixed(2));
    tk.setAttribute('x2',x2.toFixed(2)); tk.setAttribute('y2',y2.toFixed(2));
    tk.setAttribute('class','ring-tick pillar'); tk.dataset.pidx=i;
    f.appendChild(tk);

    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','pillar-label-g'); g.dataset.ang=ang;
    g.setAttribute('transform',`rotate(${ang}) translate(0 ${-PILLAR_TEXT_R}) rotate(${-ang})`);
    g.style.cursor='pointer';
    const hit=document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('class','pillar-hit');
    hit.setAttribute('x','-110'); hit.setAttribute('y','-34');
    hit.setAttribute('width','220'); hit.setAttribute('height','68');
    hit.dataset.pidx=i;
    g.appendChild(hit);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','pillar-text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','central');
    t.dataset.pidx=i;
    t.textContent=p.title.toUpperCase();
    g.appendChild(t);
    g.addEventListener('click', e=>{ e.stopPropagation(); goToIndex(i); });
    f.appendChild(g);
  });
  pillarRing.appendChild(f);
}

function buildStar(){
  starGroup.innerHTML = '';
  function pt(a,r){ const rad=(a-90)*Math.PI/180; return{x:Math.cos(rad)*r,y:Math.sin(rad)*r}; }
  const f=document.createDocumentFragment();
  PILLARS.forEach((p,i)=>{
    const tip=pt(i*STEP,STAR_R), lv=pt(i*STEP-36,STAR_INNER), rv=pt(i*STEP+36,STAR_INNER);
    const arm=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arm.setAttribute('points',`0,0 ${lv.x.toFixed(2)},${lv.y.toFixed(2)} ${tip.x.toFixed(2)},${tip.y.toFixed(2)} ${rv.x.toFixed(2)},${rv.y.toFixed(2)}`);
    arm.setAttribute('class','star-arm'); arm.setAttribute('fill','transparent'); arm.dataset.pidx=i;
    arm.style.cursor='pointer';
    arm.addEventListener('click', e=>{ e.stopPropagation(); goToIndex(i); });
    f.appendChild(arm);
    const hit=document.createElementNS('http://www.w3.org/2000/svg','circle');
    const hc=pt(i*STEP,STAR_R);
    hit.setAttribute('cx',hc.x.toFixed(2)); hit.setAttribute('cy',hc.y.toFixed(2));
    hit.setAttribute('r','70');
    hit.setAttribute('class','star-hit'); hit.dataset.pidx=i;
    hit.addEventListener('click', e=>{ e.stopPropagation(); goToIndex(i); });
    f.appendChild(hit);
  });
  const out=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  function p2(a,r){ const rad=(a-90)*Math.PI/180; return `${(Math.cos(rad)*r).toFixed(2)},${(Math.sin(rad)*r).toFixed(2)}`; }
  let pts=[];
  for(let i=0;i<5;i++){ pts.push(p2(i*STEP,STAR_R)); pts.push(p2(i*STEP+36,STAR_INNER)); }
  out.setAttribute('points',pts.join(' ')); out.setAttribute('class','star-outline');
  f.appendChild(out);
  starGroup.appendChild(f);
}


function clientAngle(e){
  const r=dialWrap.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI;
}
let pointerStartX = 0, pointerStartY = 0, gestureMode = 'undecided';
dialWrap.addEventListener('pointerdown',e=>{
  // directional-intent gate: stay undecided until the first decisive move.
  // do NOT capture the pointer yet so native vertical scroll can still win.
  dragging=false; gestureMode='undecided';
  pointerStartX=e.clientX; pointerStartY=e.clientY;
  lastPointerAng=clientAngle(e); lastDragTime=performance.now(); dragVelocity=0;
});
dialWrap.addEventListener('pointermove',e=>{
  if(gestureMode==='scroll') return;
  if(gestureMode==='undecided'){
    // desktop has no pan-y scroll on the band, so claim rotation immediately there
    if(!isMobile()){ claimRotation(e); }
    else {
      const dx=Math.abs(e.clientX-pointerStartX);
      const dy=Math.abs(e.clientY-pointerStartY);
      if(dx<3 && dy<3) return; // not enough movement to decide yet
      if(dx > 1.4*dy){ claimRotation(e); markFirstInteraction(); }
      else { gestureMode='scroll'; return; } // release to native vertical scroll
    }
  }
  if(!dragging) return;
  // while actively rotating on touch, stop the page from also scrolling
  if(e.cancelable) e.preventDefault();
  const ang=clientAngle(e);
  let d=ang-lastPointerAng;
  if(d>180)d-=360; if(d<-180)d+=360;
  rotation+=d; target+=d;
  const now=performance.now();
  dragVelocity=d/Math.max(1,now-lastDragTime);
  lastDragTime=now; lastPointerAng=ang;
  applyRotation(); liveHighlight();
}, {passive:false});
function claimRotation(e){
  gestureMode='rotate';
  dragging=true; dialWrap.classList.add('dragging');
  try { dialWrap.setPointerCapture(e.pointerId); } catch(_) {}
  lastPointerAng=clientAngle(e); lastDragTime=performance.now(); dragVelocity=0;
}
function endDrag(e){
  const wasRotating = dragging;
  dragging=false; gestureMode='undecided'; dialWrap.classList.remove('dragging');
  if(e && e.pointerId!=null){ try { dialWrap.releasePointerCapture(e.pointerId); } catch(_) {} }
  if(!wasRotating) return;
  // momentum nudge clamped so a normal flick moves one arm, a hard flick at most two
  let nudge = dragVelocity * 40;
  const cap = STEP * 1.6; // < 2 steps
  nudge = Math.max(-cap, Math.min(cap, nudge));
  navOrigin = 'dial';
  goToIndex(nearestIdx(rotation+nudge));
}
dialWrap.addEventListener('pointerup',endDrag);
dialWrap.addEventListener('pointercancel',endDrag);



let WHEEL_THRESHOLD = 20;
let leanOffset = 0; // visual lean during scroll build-up

let leanResetTimer = null;
let snapLockedUntil = 0;
function handleWheel(e){
  // On phones the page scrolls and the dial is tap/drag only. Let wheel scroll.
  if (window.innerWidth <= 820) return;
  e.preventDefault();
  // ignore wheel events for 400ms after a snap (kills trackpad inertia chaining)
  if (performance.now() < snapLockedUntil) return;

  const threshold = window.WHEEL_THRESHOLD || WHEEL_THRESHOLD;
  const lean = (window.scrollLean !== undefined ? window.scrollLean : 0);
  const buildup = window.scrollLeanBuildup || threshold;
  const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if(delta === 0) return;
  wheelAccum += delta;
  if(lean > 0){
    const progress = Math.min(Math.abs(wheelAccum) / buildup, 1);
    leanOffset = -Math.sign(wheelAccum) * Math.pow(progress, 1.5) * lean;
  } else {
    leanOffset = 0;
  }
  if(Math.abs(wheelAccum) >= threshold){
    // hold the leaned position briefly so the user sees the recoil at full amplitude
    const dir = delta > 0 ? 1 : -1;
    snapLockedUntil = performance.now() + 400;
    setTimeout(() => {
      leanOffset = 0;
      wheelAccum = 0;
      goToIndex((activeIdx + dir + PILLARS.length) % PILLARS.length);
    }, 110);
  }
  // release: when scroll stops short of threshold, reset accumulator and clear lean
  clearTimeout(leanResetTimer);
  leanResetTimer = setTimeout(() => {
    wheelAccum = 0;
    leanOffset = 0;
  }, 180);
}
dialWrap.addEventListener('wheel',handleWheel,{passive:false});


window.addEventListener('keydown',e=>{
  if(!PILLARS.length) return;
  if(e.key==='ArrowLeft') goToIndex((activeIdx+1)%PILLARS.length);
  if(e.key==='ArrowRight') goToIndex((activeIdx-1+PILLARS.length)%PILLARS.length);
  if(e.key==='Escape') goToIndex(0);
  if(e.key>='1'&&e.key<=String(PILLARS.length)) goToIndex(+e.key-1);
});


function nearestIdx(rot){
  let best=0, bestD=Infinity;
  for(let i=0;i<PILLARS.length;i++){
    const want=-i*STEP;
    // compare modulo - find shortest arc
    let d = ((rot - want) % 360 + 540) % 360 - 180;
    if(Math.abs(d)<bestD){bestD=Math.abs(d);best=i;}
  }
  return best;
}

function angDelta(a,b){ let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; }

function liveHighlight(){ highlightDial(nearestIdx(rotation)); }


let navOrigin = null; // 'dial' | 'pager' | 'arm' | null, drives mobile scroll-to-top
function goToIndex(i){
  if(!PILLARS.length || !Number.isFinite(i)) return;
  i = (i + PILLARS.length) % PILLARS.length;
  const want = -i * STEP;
  let best = want, bestD = Infinity;
  for(let k = -10; k <= 10; k++){
    const c = want + k * 360;
    const d = Math.abs(rotation - c);
    if(d < bestD){ bestD = d; best = c; }
  }
  target = best;
  activeIdx = i;
  if(PILLARS[i] && window.location.hash !== `#${PILLARS[i].id}`){
    history.replaceState(null, '', `#${PILLARS[i].id}`);
  }
  setActivePillar(i);
  // --- mobile deltas ---
  updateProgress();
  updatePager();
  if(isMobile() && navOrigin){
    scrollToReaderTop();
  }
  navOrigin = null;
}


let springK = 0.055;
let springDamp = 0.93; // higher = less bounce
let velocity = 0;
function tick(){
  if(!dragging){
    const force = (target - rotation) * (window.springK || springK);
    velocity = (velocity + force) * (window.springDamp || springDamp);
    rotation += velocity;
    if(Math.abs(target - rotation) < 0.02 && Math.abs(velocity) < 0.02){
      rotation = target; velocity = 0;
    }
    applyRotation();
  }
  requestAnimationFrame(tick);
}

function applyRotation(){
  const display = rotation + leanOffset;
  rotor.setAttribute('transform',`rotate(${display.toFixed(3)})`);
  document.querySelectorAll('.pillar-label-g').forEach(g=>{
    const ang=+g.dataset.ang;
    g.setAttribute('transform',`rotate(${ang}) translate(0 ${-PILLAR_TEXT_R}) rotate(${-ang-display})`);
  });
}

let fittingReader = false;
function fitReader(){
  if(fittingReader || !reader || !readerFit || !detailFit) return;
  if(window.innerWidth <= 820 || mode === 'case'){
    detailFit.style.transform = 'none';
    detailFit.style.width = '100%';
    reader.dataset.fitScale = '1.000';
    return;
  }
  fittingReader = true;

  detailFit.style.transform = 'scale(1)';
  detailFit.style.width = '100%';

  const styles = getComputedStyle(reader);
  const availableHeight = reader.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
  const availableForDetails = availableHeight - detailFit.offsetTop;
  const needed = Math.max(1, detailFit.scrollHeight);
  let scale = availableForDetails / needed;

  const minScale = window.innerWidth >= 1180 ? 0.8 : window.innerWidth >= 900 ? 0.7 : 0.01;
  scale = Math.max(minScale, Math.min(1, scale));
  detailFit.style.transform = `scale(${scale})`;
  detailFit.style.width = `${100 / scale}%`;
  reader.dataset.fitScale = scale.toFixed(3);

  fittingReader = false;
}

function setMode(m){

/* ---------- mobile-only helpers (deltas) ---------- */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function isMobile(){ return window.innerWidth < 980; }
let firstInteraction = false;

function buildThumbControls(){
  // Home the Guide/Case toggle where it is VISIBLE at the current breakpoint:
  // the fixed thumb bar on phones, the reader's mode-bar on desktop. A matchMedia
  // listener re-homes it on resize so it is never trapped in a display:none host.
  const thumbToggle=document.getElementById('thumbToggle');
  const modeToggle=document.querySelector('.mode-bar .mode-toggle');
  const btnGuide=document.getElementById('btn-guide');
  const btnCase=document.getElementById('btn-case');
  if(btnCase) btnCase.textContent = BRAND.shortName || BRAND.name || 'Case';
  const desktopMQ=window.matchMedia('(min-width: 980px)');
  function placeToggle(){
    const host = desktopMQ.matches ? modeToggle : thumbToggle;
    if(host && btnCase && btnGuide){
      host.appendChild(btnCase);   // brand-name primary order: KC first
      host.appendChild(btnGuide);
    }
  }
  placeToggle();
  if(desktopMQ.addEventListener){ desktopMQ.addEventListener('change', placeToggle); }
  else if(desktopMQ.addListener){ desktopMQ.addListener(placeToggle); }
  // build the 5-cell pager from PILLARS
  const pager=document.getElementById('thumbPager');
  if(pager){
    pager.innerHTML='';
    PILLARS.forEach((p,i)=>{
      const cell=document.createElement('button');
      cell.type='button';
      cell.className='pager-cell';
      cell.textContent=String(i+1);
      cell.setAttribute('aria-label',`${p.title}, section ${i+1} of ${PILLARS.length}`);
      cell.addEventListener('click',()=>{ markFirstInteraction(); navOrigin='pager'; goToIndex(i); });
      pager.appendChild(cell);
    });
  }
}

function updateProgress(){
  const bar=document.getElementById('thumbProgress');
  if(bar && PILLARS.length){
    bar.style.width = ((activeIdx+1)/PILLARS.length*100)+'%';
  }

function updatePager(){
  document.querySelectorAll('#thumbPager .pager-cell').forEach((cell,i)=>{
    const on=i===activeIdx;
    cell.classList.toggle('active',on);
    if(on) cell.setAttribute('aria-current','true'); else cell.removeAttribute('aria-current');
  });
}

function scrollToReaderTop(){
  const hero=document.querySelector('.hero');
  if(!hero) return;
  const top=hero.getBoundingClientRect().top + window.pageYOffset - 8;
  window.scrollTo({ top: Math.max(0, top), behavior: prefersReducedMotion ? 'auto' : 'smooth' });
}

function markFirstInteraction(){
  if(firstInteraction) return;
  firstInteraction = true;
  const hint=document.getElementById('drag-hint');
  if(hint){ hint.classList.remove('show'); }
}

function discoverabilityCue(){
  if(prefersReducedMotion || !isMobile()) return;
  const hint=document.getElementById('drag-hint');
  // fading caption
  if(hint){
    requestAnimationFrame(()=>hint.classList.add('show'));
    setTimeout(()=>{ if(!firstInteraction) hint.classList.remove('show'); }, 3200);
  }
  // one-time rotor wobble via CSS keyframe on the band
  requestAnimationFrame(()=>{
    dialWrap.classList.add('wobble');
    setTimeout(()=>dialWrap.classList.remove('wobble'), 1300);
  });
  // any touch/scroll counts as first interaction and dismisses the cue
  const dismiss=()=>{ markFirstInteraction(); window.removeEventListener('touchstart',dismiss); window.removeEventListener('wheel',dismiss); };
  window.addEventListener('touchstart',dismiss,{passive:true,once:true});
  window.addEventListener('wheel',dismiss,{passive:true,once:true});
}

async function init(){
  try {
    let rawConfig = window.FOCUS_STAR_CONFIG || null;
    if(!rawConfig){
      const response = await fetch(CONFIG_PATH, { cache: 'no-store' });
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      rawConfig = await response.json();
    }
    SOURCE_DATA = normalizeConfig(rawConfig);
    BRAND = SOURCE_DATA.brand;
    PILLARS = SOURCE_DATA.pillars;
    applyTheme(SOURCE_DATA);
    buildSectionNav();
    buildThumbControls();
    buildFineTicks();
    buildPillarRing();
    buildStar();

    const initialMode = SOURCE_DATA.defaultTab || new URLSearchParams(window.location.search).get('mode');
    if(initialMode === 'case' || initialMode === 'guide') mode = initialMode;
    const initialIdx = PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
    goToIndex(initialIdx >= 0 ? initialIdx : 0);
    setMode(mode);
    window.addEventListener('hashchange',()=>{
      const idx=PILLARS.findIndex(p=>`#${p.id}`===window.location.hash);
      if(idx>=0 && idx!==activeIdx) goToIndex(idx);
    });
    window.addEventListener('resize',()=>requestAnimationFrame(fitReader));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(fitReader));
    applyRotation();
    requestAnimationFrame(tick);
    discoverabilityCue();
  } catch(error) {
    document.getElementById('p-eyebrow').textContent = 'Config error';
    document.getElementById('p-title').textContent = 'Focus Star';
    document.getElementById('p-desc').textContent = `Could not load ${CONFIG_PATH}: ${error.message}`;
  }
}

init();
</script>
